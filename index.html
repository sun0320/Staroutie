<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>routie - Retro Habit Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=DungGeunMo&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --brand-primary: #855833;
            --brand-secondary: #D4A373;
            --brand-bg: #12100e;
            --brand-accent: #606C38;
        }
        body {
            background-color: var(--brand-bg);
            color: #fefae0;
            min-height: 100vh;
            font-family: 'DungGeunMo', monospace, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0.5rem;
        }

        .pixelated-img {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        .app-shell {
            background-color: #161310;
            border: 2px solid rgba(212, 163, 115, 0.3);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.9);
            width: 100%;
            max-width: 420px;
            height: 95vh;
            max-height: 900px;
        }

        .header-wooden-banner {
            position: relative;
            background-size: cover;
            background-position: center;
            border-bottom: 2px solid rgba(212, 163, 115, 0.3);
            overflow: hidden;
        }

        .header-content {
            position: relative;
            z-index: 2;
        }

        .flat-routine-item {
            background-color: transparent;
            border-bottom: 1px solid rgba(212, 163, 115, 0.12);
            transition: all 0.2s ease;
        }
        .flat-routine-item:hover {
            background-color: rgba(255, 255, 255, 0.03);
        }

        .refined-tab {
            background-color: rgba(44, 36, 29, 0.7);
            border: 1px solid rgba(212, 163, 115, 0.2);
            color: #b0a494;
            transition: all 0.2s ease;
        }
        .refined-tab.active {
            background-color: #D4A373;
            color: #1a1613;
            border-color: #FAEDCD;
            font-weight: 900;
        }

        .modal-backdrop {
            background-color: rgba(10, 8, 7, 0.85);
            backdrop-filter: blur(4px);
        }
        .modal-card {
            background-color: #241f1b;
            border: 2px solid rgba(212, 163, 115, 0.3);
            color: #fefae0;
        }

        .brand-text-accent { color: #D4A373; }
        .brand-bg-accent { background-color: #606C38; }
        .brand-bg-accent:hover { background-color: #556B2F; }

        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-thumb { background: rgba(212, 163, 115, 0.3); border-radius: 2px; }
    </style>
</head>
<body>
    <div class="app-shell rounded-2xl overflow-hidden flex flex-col relative">
        
        <!-- Header Section with Wooden Sign Banner Background (Completely Bright, Zero Dimming) -->
        <header id="header-banner" class="header-wooden-banner px-5 py-4 shrink-0 flex flex-col gap-3">
            <div class="header-content flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-12 h-12 flex items-center justify-center shrink-0 overflow-hidden rounded-none border border-[#d4a373]/40 bg-[#2d241d]/80 shadow">
                        <canvas id="header-canvas" width="64" height="64" class="w-full h-full pixelated-img"></canvas>
                    </div>
                    <div>
                        <h1 class="text-3xl font-black text-[#fefae0] tracking-wider leading-none drop-shadow-md">rou<span class="brand-text-accent">tie</span></h1>
                        <p class="text-[11px] text-[#dda15e] mt-1 font-bold drop-shadow" id="current-date">로딩중...</p>
                    </div>
                </div>
            </div>

            <!-- Progress Bar inside header banner -->
            <div class="header-content bg-[#1c1713]/80 border border-[#d4a373]/30 rounded-xl p-2.5 flex flex-col gap-1.5 shadow-inner backdrop-blur-sm">
                <div class="flex justify-between items-center text-xs font-black">
                    <span class="text-[#fefae0]">오늘의 루틴 달성률</span>
                    <span id="progress-text" class="brand-text-accent text-sm font-black">0%</span>
                </div>
                <div class="w-full bg-black/60 h-2 rounded-full overflow-hidden p-0.5 border border-[#d4a373]/20">
                    <div id="progress-bar" class="brand-bg-accent h-full w-0 transition-all duration-700 ease-out rounded-full shadow-md"></div>
                </div>
            </div>
        </header>

        <div class="bg-black/30 px-4 pt-2.5 flex gap-1.5 overflow-x-auto border-b border-[#d4a373]/20 shrink-0" id="section-tabs">
            <!-- Dynamic Tabs -->
        </div>

        <main class="px-4 py-3.5 flex-1 overflow-y-auto flex flex-col gap-2">
            <div class="flex justify-between items-center mb-1.5 pb-1.5 border-b border-[#d4a373]/20">
                <div class="flex items-center gap-2">
                    <h2 id="active-section-title" class="font-black text-sm text-[#fefae0]">로딩중...</h2>
                    <span id="active-section-count" class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-[#d4a373]/15 text-[#dda15e] border border-[#d4a373]/30">0개</span>
                </div>
                <div class="flex gap-1.5 items-center">
                    <button onclick="openModal('routine-modal')" class="text-[11px] font-bold px-2.5 py-1.5 brand-bg-accent text-[#fefae0] rounded-lg shadow-md transition hover:scale-105 active:scale-95 border border-[#606C38]">
                        + 루틴
                    </button>
                    <button onclick="openModal('section-modal')" class="text-[11px] font-bold px-2.5 py-1.5 bg-[#4a3b32] hover:bg-[#5c4a3f] text-[#fefae0] transition hover:scale-105 active:scale-95 border border-[#d4a373]/30 rounded-lg">
                        + 섹션
                    </button>
                    <button onclick="deleteCurrentSection()" class="text-[11px] font-bold px-2 py-1.5 bg-red-950/40 hover:bg-red-900/60 text-red-300 transition hover:scale-105 active:scale-95 border border-red-800/40 rounded-lg" title="현재 섹션 삭제">
                        삭제
                    </button>
                </div>
            </div>

            <!-- Flat Routine List (Zero Card Containers) -->
            <div id="routine-list" class="flex flex-col pb-4">
            </div>
        </main>

        <footer class="p-3.5 bg-black/50 border-t border-[#d4a373]/20 shrink-0">
            <button onclick="startRoutines()" class="w-full py-3 brand-bg-accent text-[#fefae0] font-black rounded-xl shadow-lg transition hover:brightness-110 active:scale-[0.98] flex items-center justify-center gap-2 text-xs border border-[#858d4e]">
                <span>▶ 오늘의 루틴 시작하기</span>
            </button>
        </footer>
        
        <!-- Notification Modal -->
        <div id="notification-modal" class="fixed inset-0 modal-backdrop hidden items-center justify-center z-[100] p-4 opacity-0 transition-opacity">
            <div class="modal-card rounded-2xl p-5 w-[80%] max-w-xs shadow-2xl flex flex-col gap-3 text-center transform scale-95 transition-transform" id="notification-content">
                <h3 id="notif-title" class="font-black text-base text-[#fefae0]">알림</h3>
                <p id="notif-desc" class="text-xs font-bold text-[#b0a494]">내용</p>
                <button onclick="closeNotification()" class="mt-1 py-2.5 brand-bg-accent text-[#fefae0] rounded-xl text-xs font-black active:scale-95 transition shadow-md">확인</button>
            </div>
        </div>

        <!-- Add Section Modal -->
        <div id="section-modal" class="fixed inset-0 modal-backdrop hidden items-center justify-center z-50 p-4">
            <div class="modal-card rounded-2xl p-5 w-full max-w-xs shadow-2xl flex flex-col gap-3">
                <h3 class="font-black text-sm text-[#fefae0]">새 루틴 섹션 추가</h3>
                <input type="text" id="new-section-name" placeholder="예: 오후 루틴" class="px-3.5 py-2.5 text-xs border border-[#d4a373]/30 rounded-xl focus:outline-none focus:border-[#d4a373] transition font-bold bg-[#141210] text-[#fefae0]">
                <div class="flex gap-2 mt-1">
                    <button onclick="closeModal('section-modal')" class="flex-1 py-2.5 bg-[#3a3028] hover:bg-[#4a3d34] rounded-xl text-xs font-bold text-[#b0a494] active:scale-95 transition">취소</button>
                    <button onclick="addSection()" class="flex-1 py-2.5 brand-bg-accent text-[#fefae0] rounded-xl text-xs font-black active:scale-95 transition shadow-md">추가하기</button>
                </div>
            </div>
        </div>

        <!-- Add Routine Modal -->
        <div id="routine-modal" class="fixed inset-0 modal-backdrop hidden items-center justify-center z-50 p-4">
            <div class="modal-card rounded-2xl p-5 w-full max-w-xs shadow-2xl flex flex-col gap-3">
                <h3 class="font-black text-sm text-[#fefae0]">새 루틴 추가</h3>
                <div class="flex flex-col gap-2.5">
                    <div>
                        <label class="text-[10px] font-bold text-[#b0a494] mb-1 block ml-0.5">루틴 이름</label>
                        <input type="text" id="new-routine-title" placeholder="예: 물 한잔 마시기" class="w-full px-3.5 py-2.5 text-xs border border-[#d4a373]/30 rounded-xl focus:outline-none focus:border-[#d4a373] transition font-bold bg-[#141210] text-[#fefae0]">
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-[#b0a494] mb-1 block ml-0.5">소요 시간 (분)</label>
                        <input type="number" id="new-routine-duration" value="5" min="1" class="w-full px-3.5 py-2.5 text-xs border border-[#d4a373]/30 rounded-xl focus:outline-none focus:border-[#d4a373] transition font-bold bg-[#141210] text-[#fefae0]">
                    </div>
                </div>
                <div class="flex gap-2 mt-1">
                    <button onclick="closeModal('routine-modal')" class="flex-1 py-2.5 bg-[#3a3028] hover:bg-[#4a3d34] rounded-xl text-xs font-bold text-[#b0a494] active:scale-95 transition">취소</button>
                    <button onclick="addRoutine()" class="flex-1 py-2.5 brand-bg-accent text-[#fefae0] rounded-xl text-xs font-black active:scale-95 transition shadow-md">추가하기</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const HEADER_BANNER_URL = 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTn9Kt5APOiHR5MN7r1Qmpe04ll6q072-C91mtyYnfUzA&s';
        const HEADER_ICON_URL = 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQag3NQ_QBPs5SmoQjYV-FeLpZNYyaSKF87XE1EOdvYlw&s';

        let appData = {
            activeSection: '모닝 루틴',
            sections: [
                {
                    name: '모닝 루틴',
                    routines: [
                        { id: 1, title: '기상 직후 미온수 한 잔 마시기', duration: 2, completed: false },
                        { id: 2, title: '가벼운 전신 스트레칭 및 환기', duration: 10, completed: false }
                    ]
                },
                {
                    name: '나이트 루틴',
                    routines: [
                        { id: 3, title: '방 안 정리정돈 및 책상 청소', duration: 10, completed: false },
                        { id: 4, title: '내일 일정 및 투두리스트 점검', duration: 5, completed: false }
                    ]
                }
            ]
        };

        function init() {
            const savedData = localStorage.getItem('routie_habit_app_data_v17');
            if (savedData) {
                try {
                    appData = JSON.parse(savedData);
                } catch(e) {}
            }

            renderDate();
            setupHeaderBackground();
            setupHeaderIcon();
            renderApp();
        }

        function setupHeaderBackground() {
            const banner = document.getElementById('header-banner');
            banner.style.backgroundImage = `url('${HEADER_BANNER_URL}')`;
        }

        function setupHeaderIcon() {
            const canvas = document.getElementById('header-canvas');
            const ctx = canvas.getContext('2d');
            const img = new Image();
            img.crossOrigin = "anonymous";
            img.src = HEADER_ICON_URL;
            
            img.onload = () => {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                
                try {
                    const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const data = imgData.data;
                    
                    for (let i = 0; i < data.length; i += 4) {
                        const r = data[i];
                        const g = data[i + 1];
                        const b = data[i + 2];
                        
                        if (r > 230 && g > 230 && b > 230) {
                            data[i + 3] = 0;
                        }
                    }
                    ctx.putImageData(imgData, 0, 0);
                } catch(e) {
                    console.log('Canvas cross-origin filter handled.');
                }
            };
        }

        function renderDate() {
            const now = new Date();
            const days = ['일', '월', '화', '수', '목', '금', '토'];
            document.getElementById('current-date').innerText = 
                `${now.getFullYear()}년 ${now.getMonth()+1}월 ${now.getDate()}일 ${days[now.getDay()]}요일`;
        }

        function saveData() {
            localStorage.setItem('routie_habit_app_data_v17', JSON.stringify(appData));
            renderApp();
        }

        function renderApp() {
            const tabsContainer = document.getElementById('section-tabs');
            tabsContainer.innerHTML = '';
            
            appData.sections.forEach(sec => {
                const isSelected = sec.name === appData.activeSection;
                const btn = document.createElement('button');
                btn.className = `px-3.5 py-2 text-[11px] font-bold rounded-t-lg transition whitespace-nowrap outline-none refined-tab ${
                    isSelected ? 'active' : ''
                }`;
                btn.innerText = sec.name;
                btn.onclick = () => {
                    appData.activeSection = sec.name;
                    renderApp();
                };
                tabsContainer.appendChild(btn);
            });

            let currentSec = appData.sections.find(s => s.name === appData.activeSection);
            
            if (!currentSec && appData.sections.length > 0) {
                currentSec = appData.sections[0];
                appData.activeSection = currentSec.name;
            } else if (!currentSec) {
                document.getElementById('active-section-title').innerText = '섹션 없음';
                document.getElementById('active-section-count').innerText = '0개';
                document.getElementById('routine-list').innerHTML = `<div class="text-center py-10 text-[#b0a494] text-xs font-bold">+ 섹션 버튼을 눌러 추가해주세요.</div>`;
                updateProgress(0, 0);
                return;
            }

            document.getElementById('active-section-title').innerText = currentSec.name;
            document.getElementById('active-section-count').innerText = `${currentSec.routines.length}개`;

            const listContainer = document.getElementById('routine-list');
            listContainer.innerHTML = '';

            if (currentSec.routines.length === 0) {
                listContainer.innerHTML = `<div class="text-center py-12 text-[#b0a494] text-xs font-bold">등록된 루틴이 없습니다.<br>+ 루틴 버튼을 눌러 추가해보세요!</div>`;
            } else {
                currentSec.routines.forEach(routine => {
                    const item = document.createElement('div');
                    item.className = `py-3 px-2.5 rounded-lg flat-routine-item flex items-center justify-between group ${
                        routine.completed ? 'opacity-40 grayscale-[0.2]' : ''
                    }`;
                    
                    item.innerHTML = `
                        <div class="flex items-center gap-3 flex-1 cursor-pointer" onclick="toggleRoutine(${routine.id})">
                            <div class="relative flex items-center justify-center w-5 h-5 shrink-0">
                                <input type="checkbox" ${routine.completed ? 'checked' : ''} class="w-5 h-5 appearance-none border-2 border-[#d4a373] rounded-md checked:bg-[#606C38] checked:border-[#606C38] transition-colors cursor-pointer bg-black/40">
                                ${routine.completed ? '<span class="absolute text-white text-xs pointer-events-none font-black">✓</span>' : ''}
                            </div>
                            <div class="flex flex-col flex-1">
                                <h3 class="font-bold text-xs ${routine.completed ? 'line-through text-[#8c8275]' : 'text-[#fefae0]'} transition-all">${routine.title}</h3>
                                <p class="text-[10px] font-bold text-[#b0a494] mt-0.5">⏱️ ${routine.duration}분</p>
                            </div>
                        </div>
                        <button onclick="deleteRoutine(${routine.id})" class="text-[#8c8275] hover:text-red-400 hover:bg-red-950/30 p-2 rounded-lg transition shrink-0 ml-1" title="루틴 삭제">
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" viewBox="0 0 16 16"><path d="M5.5 5.5A.5.5 0 0 1 6 6v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5zm2.5 0a.5.5 0 0 1 .5.5v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5zm3 .5a.5.5 0 0 0-1 0v6a.5.5 0 0 0 1 0V6z"/><path fill-rule="evenodd" d="M14.5 3a1 1 0 0 1-1 1H13v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4h-.5a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1H6a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1h3.5a1 1 0 0 1 1 1v1zM4.118 4 4 4.059V13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4.059L11.882 4H4.118zM2.5 3V2h11v1h-11z"/></svg>
                        </button>
                    `;
                    listContainer.appendChild(item);
                });
            }

            const total = currentSec.routines.length;
            const completed = currentSec.routines.filter(r => r.completed).length;
            updateProgress(completed, total);
        }

        function updateProgress(completed, total) {
            const percent = total > 0 ? Math.round((completed / total) * 100) : 0;
            document.getElementById('progress-text').innerText = `${percent}%`;
            document.getElementById('progress-bar').style.width = `${percent}%`;
        }

        function toggleRoutine(id) {
            const currentSec = appData.sections.find(s => s.name === appData.activeSection);
            if (!currentSec) return;
            const routine = currentSec.routines.find(r => r.id === id);
            if (routine) {
                routine.completed = !routine.completed;
                saveData();
            }
        }

        function deleteRoutine(id) {
            const currentSec = appData.sections.find(s => s.name === appData.activeSection);
            if (!currentSec) return;
            currentSec.routines = currentSec.routines.filter(r => r.id !== id);
            saveData();
        }

        function deleteCurrentSection() {
            if (appData.sections.length <= 1) {
                showNotification('삭제 불가', '최소 1개의 섹션은 유지해야 합니다.');
                return;
            }
            const index = appData.sections.findIndex(s => s.name === appData.activeSection);
            if (index > -1) {
                appData.sections.splice(index, 1);
                appData.activeSection = appData.sections[0].name;
                saveData();
            }
        }

        function openModal(id) {
            const modal = document.getElementById(id);
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            
            if(id === 'section-modal') {
                const input = document.getElementById('new-section-name');
                input.value = '';
                setTimeout(() => input.focus(), 50);
            }
            if(id === 'routine-modal') {
                const input = document.getElementById('new-routine-title');
                input.value = '';
                document.getElementById('new-routine-duration').value = '5';
                setTimeout(() => input.focus(), 50);
            }
        }

        function closeModal(id) {
            const modal = document.getElementById(id);
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        function showNotification(title, message) {
            document.getElementById('notif-title').innerText = title;
            document.getElementById('notif-desc').innerText = message;
            const modal = document.getElementById('notification-modal');
            const content = document.getElementById('notification-content');
            
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                content.classList.remove('scale-95');
            }, 10);
        }

        function closeNotification() {
            const modal = document.getElementById('notification-modal');
            const content = document.getElementById('notification-content');
            
            modal.classList.add('opacity-0');
            content.classList.add('scale-95');
            
            setTimeout(() => {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }, 200);
        }

        function addSection() {
            const name = document.getElementById('new-section-name').value.trim();
            if (!name) return showNotification('입력 오류', '섹션 이름을 입력해주세요.');
            if (appData.sections.some(s => s.name === name)) return showNotification('중복 오류', '이미 존재하는 섹션 이름입니다.');

            appData.sections.push({ name: name, routines: [] });
            appData.activeSection = name;
            closeModal('section-modal');
            saveData();
        }

        function addRoutine() {
            const title = document.getElementById('new-routine-title').value.trim();
            const duration = parseInt(document.getElementById('new-routine-duration').value) || 5;

            if (!title) return showNotification('입력 오류', '루틴 이름을 입력해주세요.');

            const currentSec = appData.sections.find(s => s.name === appData.activeSection);
            if (!currentSec) {
                closeModal('routine-modal');
                return showNotification('오류', '섹션을 먼저 추가해주세요.');
            }

            currentSec.routines.push({
                id: Date.now(),
                title: title,
                duration: duration,
                completed: false
            });

            closeModal('routine-modal');
            saveData();
        }

        function startRoutines() {
            const currentSec = appData.sections.find(s => s.name === appData.activeSection);
            if (!currentSec || currentSec.routines.length === 0) {
                showNotification('알림', '시작할 루틴이 없습니다.');
                return;
            }
            showNotification('루틴 시작 🌱', `'${currentSec.name}' 루틴 세션이 시작되었습니다!`);
        }

        window.onload = init;
    </script>
</body>
</html>
