<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Routie - Daily Routine Tracker</title>
    
    <link rel="manifest" href="data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22Routie%20-%20Daily%20Routine%20Tracker%22%2C%22short_name%22%3A%22Routie%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23ffffff%22%2C%22theme_color%22%3A%22%239B111E%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22data%3Aimage%2Fsvg%2Fsvg%2Bxml%3Butf-8%2C%253Csvg%2520xmlns%253D%2527http%253A%2F%2Fwww.w3.org%2F2000%2Fsvg%2527%2520viewBox%253D%25270%25200%2520512%2520512%2527%253E%253Crect%2520width%253D%2527512%2527%2520height%253D%2527512%2527%2520rx%253D%2527110%2527%2520fill%253D%2527%25239B111E%2527%2F%253E%253Ccircle%2520cx%253D%2527256%2527%2520cy%253D%2527256%2527%2520r%253D%2527160%2527%2520fill%253D%2527none%2527%2520stroke%253D%2527%2523ffffff%2527%2520stroke-width%253D%252732%2527%2F%253E%253Cpolyline%2520points%253D%2527256%2520140%2520256%2520256%2520330%2520296%2527%2520fill%253D%2527none%2527%2520stroke%253D%2527%2523ffffff%2527%2520stroke-width%253D%252732%2527%2520stroke-linecap%253D%2527round%2527%2520stroke-linejoin%253D%2527round%2527%2F%253E%253C%2Fsvg%253E%22%2C%22sizes%22%3A%22512x512%22%2C%22type%22%3A%22image%2Fsvg%2Fsvg%2Bxml%22%2C%22purpose%22%3A%22any%20maskable%22%7D%5D%7D">
    <link rel="apple-touch-icon" href="data:image/svg+xml;utf-8,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%253D%270%200%20512%20512%27%3E%3Crect%20width%3D%27512%27%20height%3D%27512%27%20rx%253D%27110%27%20fill%3D%27%239B111E%27%2F%3E%3Ccircle%2520cx%253D%27256%27%2520cy%253D%27256%27%2520r%253D%27160%27%2520fill%253D%27none%27%2520stroke%253D%2527%2523ffffff%2527%2520stroke-width%253D%252732%2527%2F%253E%253Cpolyline%2520points%253D%2527256%20140%20256%20256%20330%20296%27%20fill%253D%27none%27%2520stroke%253D%2527%2523ffffff%2527%2520stroke-width%253D%252732%2527%2520stroke-linecap%253D%2527round%2527%2520stroke-linejoin%253D%2527round%2527%2F%253E%253C%2Fsvg%253E">

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <style>
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, 'Helvetica Neue', 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
            -webkit-tap-highlight-color: transparent;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            user-select: none;
            -webkit-user-select: none;
        }
        input, textarea, [contenteditable="true"] {
            user-select: text;
            -webkit-user-select: text;
        }
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.1);
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 0, 0, 0.2);
        }

        .btn-effect {
            position: relative;
            overflow: hidden;
            transition: background-color 0.15s ease, filter 0.15s ease;
        }
        .btn-effect:active {
            filter: brightness(0.88);
        }
        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.4);
            transform: scale(0);
            animation: ripple-anim 0.4s linear;
            pointer-events: none;
        }
        @keyframes ripple-anim {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        .habit-row-wrapper, .section-row-wrapper {
            position: relative;
            overflow: hidden;
            border-radius: 0.75rem;
            user-select: none;
            -webkit-user-select: none;
            touch-action: pan-y;
            transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
        }
        .habit-row-wrapper.dragging, .section-row-wrapper.dragging {
            opacity: 0.4;
            transform: scale(0.98);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            z-index: 50;
            touch-action: none;
        }
        .habit-row-wrapper.drag-over, .section-row-wrapper.drag-over {
            border-top: 2px dashed var(--accent-color);
        }
        .habit-content-card, .section-content-card {
            position: relative;
            z-index: 2;
            transition: transform 0.15s cubic-bezier(0.25, 1, 0.5, 1);
            background: inherit;
        }
        .habit-actions-container, .section-actions-container {
            position: absolute;
            top: 0;
            bottom: 0;
            right: 0;
            width: 76px;
            display: flex;
            z-index: 1;
            border-radius: 0.75rem;
            overflow: hidden;
            gap: 2px;
            padding: 4px;
            background: rgba(0,0,0,0.03);
        }
        .section-actions-container {
            width: 76px;
        }
        .section-action-btn, .habit-action-btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            cursor: pointer;
        }
        .section-edit-action {
            background-color: #64748b;
            border-radius: 0.75rem 0.3rem 0.3rem 0.75rem;
        }
        .section-delete-action {
            background-color: #ef4444;
            border-radius: 0.3rem 0.75rem 0.75rem 0.3rem;
        }
        .habit-edit-action {
            background-color: #64748b;
            border-radius: 0.5rem 0.2rem 0.2rem 0.5rem;
        }
        .habit-delete-action {
            background-color: #ef4444;
            border-radius: 0.2rem 0.5rem 0.5rem 0.2rem;
        }
    </style>
</head>
<body class="transition-colors duration-300 min-h-screen flex flex-col items-center justify-start py-8 px-4 sm:px-6" id="body-bg">
    
    <div class="w-full max-w-md flex flex-col min-h-[85vh] pb-24 relative">
        
        <header class="flex items-center justify-between mb-6 px-1">
            <div class="flex items-center space-x-3.5">
                <div onclick="openAppIconModal()" id="app-icon-container" class="w-18 h-18 rounded-2xl overflow-hidden border border-stone-200 shadow-xs flex items-center justify-center cursor-pointer transition-transform hover:scale-105 shrink-0 bg-white btn-effect">
                </div>

                <div>
                    <h1 class="text-xs font-medium tracking-widest opacity-80" id="header-subtitle">Daily Routine</h1>
                    <h2 class="text-lg font-bold tracking-tight opacity-95" id="header-title">Routie</h2>
                </div>
            </div>

            <!-- Theme Switcher -->
            <div class="flex items-center space-x-2">
                <div class="flex items-center space-x-1.5 bg-white p-1.5 rounded-full shadow-xs border border-stone-200">
                    <button onclick="setTheme('lavender')" class="w-4 h-4 rounded-full bg-white hover:scale-110 transition-transform cursor-pointer border border-stone-300 btn-effect" title="Lavender"></button>
                    <button onclick="setTheme('pink')" class="w-4 h-4 rounded-full bg-[#f8b4c4] hover:scale-110 transition-transform cursor-pointer border border-[#f59eb2]" title="Pastel Pink"></button>
                    <button onclick="setTheme('mint')" class="w-4 h-4 rounded-full bg-emerald-200 hover:scale-110 transition-transform cursor-pointer border border-emerald-300 btn-effect" title="Mint"></button>
                    <button onclick="setTheme('indigoblue')" class="w-4 h-4 rounded-full bg-[#8fa9c4] hover:scale-110 transition-transform cursor-pointer border border-[#7896b5] btn-effect" title="Indigo Blue"></button>
                    <button onclick="setTheme('stardew')" class="w-4 h-4 rounded-full bg-[#c28859] hover:scale-110 transition-transform cursor-pointer border border-[#b07343] btn-effect" title="Stardew Valley"></button>
                </div>
            </div>
        </header>

        <div class="relative mb-10 px-2">
            <div class="absolute top-[18px] left-6 right-6 h-0.5 bg-stone-300 z-0" id="day-line"></div>
            <div class="relative z-10 flex justify-between items-start" id="day-selector-container"></div>
        </div>

        <div class="w-full h-px mb-6 mx-auto" id="main-separator-line"></div>

        <main class="flex-1 flex flex-col space-y-6" id="sections-container">

        <!-- Floating Action Button for Focus Mode -->

            <button onclick="openFocusMode()" id="floating-play-btn" class="pointer-events-auto w-20 h-20 rounded-full shadow-xl flex items-center justify-center text-white transition-all cursor-pointer btn-effect" style="background-color: var(--accent-color);">
                <svg class="w-10 h-10 fill-current ml-0.5" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            </button>
        </div>

        <!-- Floating Action Button for Add Section -->
        <div class="fixed bottom-6 left-6 z-40">
            <button onclick="openAddSectionModal()" id="floating-add-section-btn" class="w-14 h-14 rounded-full shadow-lg flex items-center justify-center text-white transition-all cursor-pointer btn-effect" style="background-color: var(--accent-color);" title="새 섹션 추가하기">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"></path></svg>
            </button>
        </div>

    </div>

    <div id="app-icon-modal" class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl p-6 w-full max-w-sm shadow-xl border border-stone-200 flex flex-col space-y-4">
            <h3 class="text-base font-bold text-stone-800">앱 아이콘 설정</h3>
            <p class="text-xs text-stone-500">원하는 사진을 업로드하거나 테마 기본 아이콘으로 되돌릴 수 있습니다.</p>
            
            <div class="flex flex-col space-y-2.5 pt-2">
                <button onclick="document.getElementById('app-image-input').click(); closeAppIconModal();" class="w-full py-3 px-4 rounded-xl text-white text-xs font-bold transition cursor-pointer btn-effect flex items-center justify-center space-x-2" style="background-color: var(--accent-color);">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>

                <button onclick="resetAppIconToDefault()" class="w-full py-3 px-4 rounded-xl border border-stone-200 text-stone-700 text-xs font-bold transition hover:bg-stone-50 cursor-pointer btn-effect flex items-center justify-center space-x-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>

        <div class="bg-white rounded-3xl p-6 w-full max-w-sm shadow-xl border border-stone-200 flex flex-col space-y-4">
            <h3 id="section-modal-title" class="text-base font-bold text-stone-800">새 섹션 추가</h3>
            <input type="text" id="section-name-input" placeholder="섹션 이름 (예: Morning Routine)" class="w-full px-4 py-3 rounded-xl border border-stone-200 text-sm focus:outline-none focus:border-stone-400 bg-white">
            
            <div class="flex flex-col space-y-2 pt-1">

    <div id="habit-modal" class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 hidden">

            <input type="text" id="habit-name-input" placeholder="습관 이름 (예: 물 한 잔 마시기)" class="w-full px-4 py-3 rounded-xl border border-stone-200 text-sm focus:outline-none focus:border-stone-400 bg-white">
            
            <div class="flex items-center justify-between px-1 pt-1">
                <span class="text-xs font-bold text-stone-700">타이머 시간 설정</span>
                <label class="relative inline-flex items-center cursor-pointer">
                    <input type="checkbox" id="has-timer-checkbox" onchange="toggleTimerSettingsVisibility()" class="sr-only peer" checked>
                    <div class="w-9 h-5 bg-stone-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-stone-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-[var(--accent-color)]"></div>
                </label>
            </div>

            <!-- Dial Timer Section -->
            <div id="timer-settings-container" class="flex flex-col items-center bg-stone-50 p-4 rounded-2xl border border-stone-200 transition-all space-y-3">
                <div class="relative w-44 h-44 select-none cursor-grab active:cursor-grabbing touch-none" id="timer-dial-container">
                    <!-- Outer dial track ring -->

                        <circle id="dial-progress-circle" cx="50" cy="50" r="42" fill="none" stroke="var(--accent-color)" stroke-width="8" stroke-dasharray="264" stroke-dashoffset="0" stroke-linecap="round" class="transition-all duration-75"></circle>
                    </svg>
                    <!-- Center display info -->
                    <div class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none">

                        <span class="text-[10px] text-stone-400 font-medium">원형 다이얼 드래그</span>

                </div>

                <!-- Quick adjustment buttons row -->
                <div class="grid grid-cols-4 gap-1.5 w-full pt-1">

                    <button type="button" onclick="addDialMinutes(5)" class="py-1.5 rounded-xl bg-white border border-stone-200 text-stone-700 text-xs font-bold hover:bg-stone-100 btn-effect">+5분</button>

                    <button type="button" onclick="resetDialTime()" class="py-1.5 rounded-xl bg-stone-200/70 border border-stone-300 text-stone-600 text-xs font-bold hover:bg-stone-200 btn-effect">초기화</button>

                <button onclick="saveHabit()" class="flex-1 py-2.5 rounded-xl text-white text-xs font-medium cursor-pointer btn-effect" id="habit-save-btn" style="background-color: var(--accent-color);">저장</button>

    <div id="focus-modal" class="fixed inset-0 z-50 flex flex-col justify-between p-6 hidden opacity-0 transition-opacity duration-300">
        <div class="max-w-md w-full mx-auto flex items-center justify-between text-white pt-2">

                <span id="focus-sec-badge" class="text-xs font-bold uppercase px-3.5 py-1.5 bg-white/10 text-white/90 rounded-full border border-white/10">모닝 루틴</span>

            <button onclick="closeFocusMode()" class="w-9 h-9 rounded-xl bg-white/10 hover:bg-white/25 transition flex items-center justify-center text-white cursor-pointer btn-effect">

        </div>

        <div class="max-w-md w-full mx-auto text-center my-auto text-white px-4">

            <h2 id="focus-habit-title" class="text-2xl sm:text-3xl font-extrabold mb-10 tracking-tight leading-snug">물 한 잔 마시기</h2>
            
            <div class="relative w-52 h-52 mx-auto flex items-center justify-center mb-6">
                <div class="absolute inset-0 rounded-full border-4 border-white/15"></div>
                <svg class="absolute inset-0 w-full h-full -rotate-90" viewBox="0 0 100 100">
                    <circle id="timer-circle" cx="50" cy="50" r="46" fill="none" stroke="#ffffff" stroke-width="4" stroke-dasharray="289" stroke-dashoffset="0" stroke-linecap="round" class="transition-all duration-1000 ease-linear"/>
                </svg>
                <div class="text-center z-10">
                    <div id="timer-display" class="text-4xl sm:text-5xl font-extrabold font-mono tracking-tight text-white">05:00</div>

        <div class="max-w-md w-full mx-auto flex items-center justify-center space-x-3 pb-6">

                <span id="play-pause-text">일시정지</span>
            </button>
            <button onclick="completeFocusAndNext()" id="focus-done-btn" class="px-5 py-3.5 rounded-2xl text-white font-bold text-xs shadow-lg transition cursor-pointer btn-effect">
                완료 & 다음 ➔
            </button>
        </div>
    </div>

    <script>
        document.addEventListener('click', function(e) {
            const target = e.target.closest('button, .btn-effect');
            if (!target) return;

            playBubblePopSound();

            const rect = target.getBoundingClientRect();
            const ripple = document.createElement('span');
            ripple.className = 'ripple';
            const size = Math.max(rect.width, rect.height);
            ripple.style.width = ripple.style.height = `${size}px`;
            ripple.style.left = `${e.clientX - rect.left - size / 2}px`;
            ripple.style.top = `${e.clientY - rect.top - size / 2}px`;
            target.appendChild(ripple);
            setTimeout(() => ripple.remove(), 400);
        });

        let audioCtx = null;
        function playBubblePopSound() {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                const startFreq = 420 + Math.random() * 180;
                const endFreq = 90 + Math.random() * 30;

                osc.type = 'sine';
                osc.frequency.setValueAtTime(startFreq, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(endFreq, audioCtx.currentTime + 0.05);

                gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 0.05);
            } catch (e) {}
        }

        function playSwitchClickSound() {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'triangle';
                osc.frequency.setValueAtTime(900, now);
                osc.frequency.exponentialRampToValueAtTime(350, now + 0.03);

                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.03);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start(now);
                osc.stop(now + 0.03);
            } catch (e) {}
        }

        function playTimerCompleteBellSound() {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                const now = audioCtx.currentTime;
                const frequencies = [523.25, 659.25, 783.99, 1046.50];

                frequencies.forEach((freq, index) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();

                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now + index * 0.06);

                    gain.gain.setValueAtTime(0, now + index * 0.06);
                    gain.gain.linearRampToValueAtTime(0.12, now + index * 0.06 + 0.02);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + index * 0.06 + 0.9);

                    osc.connect(gain);
                    gain.connect(audioCtx.destination);

                    osc.start(now + index * 0.06);
                    osc.stop(now + index * 0.06 + 0.9);
                });
            } catch (e) {}
        }

        function getWeekDates() {
            const now = new Date();
            const currentDayOfWeek = now.getDay(); // 0 is Sunday, 1 is Monday...
            const distanceToMonday = currentDayOfWeek === 0 ? -6 : 1 - currentDayOfWeek;
            
            const monday = new Date(now);
            monday.setDate(now.getDate() + distanceToMonday);

            const dates = {};
            daysOfWeek.forEach(d => {
                let offset = 0;
                if (d.key === 'mon') offset = 0;
                else if (d.key === 'tue') offset = 1;
                else if (d.key === 'wed') offset = 2;
                else if (d.key === 'thu') offset = 3;
                else if (d.key === 'fri') offset = 4;
                else if (d.key === 'sat') offset = 5;
                else if (d.key === 'sun') offset = 6;

                const targetDate = new Date(monday);
                targetDate.setDate(monday.getDate() + offset);
                dates[d.key] = targetDate.getDate();
            });
            return dates;
        }

        function handleHabitTouchMove(e, habitId) {
            e.stopPropagation();
            if (isHabitDragging) {
                if (e.cancelable) e.preventDefault();
                const touch = e.touches[0];
                const elem = document.elementFromPoint(touch.clientX, touch.clientY);
                const targetWrap = elem ? elem.closest('.habit-row-wrapper') : null;
                document.querySelectorAll('.habit-row-wrapper').forEach(el => el.classList.remove('drag-over'));
                if (targetWrap && targetWrap.dataset.habitId !== habitId) {
                    targetWrap.classList.add('drag-over');
                }
                return;
            }

            if (!isHabitSwiping) return;
            const touch = e.touches[0];
            const diffX = touch.clientX - habitSwipeStartX;
            const diffY = touch.clientY - habitSwipeStartY;

            if (Math.abs(diffY) > 8 && Math.abs(diffY) > Math.abs(diffX)) {
                clearTimeout(habitLongPressTimer);
                isHabitSwiping = false;
                return;
            }

            if (Math.abs(diffX) > 4) {
                clearTimeout(habitLongPressTimer);
            }

            let newTranslate = diffX;
            if (newTranslate > 0) newTranslate = 0;
            if (newTranslate < maxHabitSwipeWidth - 15) newTranslate = maxHabitSwipeWidth - 15;

            const card = document.getElementById(`habit-card-${habitId}`);
            if (card) card.style.transform = `translateX(${newTranslate}px)`;
        }

        /* Improved Relative Angular Dial Interaction Logic */
        function initDialEventListeners() {
            const container = document.getElementById('timer-dial-container');
            if (!container) return;

            const getAngle = (clientX, clientY) => {
                const rect = container.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;
                const radians = Math.atan2(clientY - centerY, clientX - centerX);
                let degrees = radians * (180 / Math.PI) + 90;
                if (degrees < 0) degrees += 360;
                return degrees;
            };

            const onStart = (clientX, clientY) => {
                isDialDragging = true;
                dialStartAngle = getAngle(clientX, clientY);
                dialBaseSeconds = dialTotalSeconds;
            };

            const onMove = (clientX, clientY) => {
                if (!isDialDragging) return;
                const currentAngle = getAngle(clientX, clientY);
                
                let angleDiff = currentAngle - dialStartAngle;
                if (angleDiff > 180) angleDiff -= 360;
                if (angleDiff < -180) angleDiff += 360;

                let deltaSeconds = (angleDiff / 360) * 1800;
                let calculatedSecs = Math.round((dialBaseSeconds + deltaSeconds) / 10) * 10;
                
                if (calculatedSecs < 10) calculatedSecs = 10;
                if (calculatedSecs > maxDialSeconds) calculatedSecs = maxDialSeconds;
                
                dialTotalSeconds = calculatedSecs;
                updateDialDisplay();
            };

            const onEnd = () => {
                isDialDragging = false;
            };

            container.addEventListener('mousedown', (e) => {
                e.preventDefault();
                onStart(e.clientX, e.clientY);
            });

            window.addEventListener('mousemove', (e) => {
                if (isDialDragging) {
                    e.preventDefault();
                    onMove(e.clientX, e.clientY);
                }
            });

            window.addEventListener('mouseup', () => {
                if (isDialDragging) {
                    onEnd();
                }
            });

            container.addEventListener('touchstart', (e) => {
                if (e.touches.length > 0) {
                    onStart(e.touches[0].clientX, e.touches[0].clientY);
                }
            }, { passive: true });

            window.addEventListener('touchmove', (e) => {
                if (isDialDragging && e.touches.length > 0) {
                    onMove(e.touches[0].clientX, e.touches[0].clientY);
                }
            }, { passive: true });

            window.addEventListener('touchend', () => {
                if (isDialDragging) {
                    onEnd();
                }
            });
        }

        function addDialMinutes(mins) {
            dialTotalSeconds += mins * 60;
            if (dialTotalSeconds > maxDialSeconds) dialTotalSeconds = maxDialSeconds;
            updateDialDisplay();
            playSwitchClickSound();
        }

        function resetDialTime() {
            dialTotalSeconds = 300;
            updateDialDisplay();
            playSwitchClickSound();
        }

        function updateDialDisplay() {
            const m = Math.floor(dialTotalSeconds / 60);
            const s = dialTotalSeconds % 60;
            const timeDisplay = document.getElementById('dial-time-display');
            if (timeDisplay) timeDisplay.textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;

            const circumference = 264; // 2 * PI * r (r=42)
            const ratio = dialTotalSeconds / maxDialSeconds;
            const strokeDashoffset = circumference - (ratio * circumference);
            
            const progressCircle = document.getElementById('dial-progress-circle');
            if (progressCircle) progressCircle.style.strokeDashoffset = strokeDashoffset;
        }

        function saveHabit() {
            const name = document.getElementById('habit-name-input').value.trim();
            if (!name) { alert('습관 이름을 입력해주세요.'); return; }

            const hasTimer = document.getElementById('has-timer-checkbox').checked;
            const totalSec = hasTimer ? dialTotalSeconds : 0;

            const sec = sections.find(s => s.id === activeSectionIdForHabit);
            if (sec) {
                if (editingHabitId) {
                    const hab = sec.habits.find(h => h.id === editingHabitId);
                    if (hab) {
                        hab.name = name;
                        hab.durationSec = totalSec;
                        hab.repeatDays = { ...tempHabitRepeatDays };
                    }
                } else {
                    sec.habits.push({
                        id: 'hab_' + Date.now(),
                        name: name,
                        durationSec: totalSec,
                        repeatDays: { ...tempHabitRepeatDays },
                        completed: { mon: false, tue: false, wed: false, thu: false, fri: false, sat: false, sun: false }
                    });
                }
                saveData();
                renderSections();
                closeHabitModal();
            }
        }

        function buildFlatHabits() {
            flatHabits = [];
            sections.forEach(sec => {
                if (sec.repeatDays && sec.repeatDays[selectedDay] === false) return;
                sec.habits.forEach(hab => {
                    if (hab.repeatDays && hab.repeatDays[selectedDay] === false) return;
                    if (!hab.completed) hab.completed = {};
                    flatHabits.push({
                        secId: sec.id,
                        secTitle: sec.name,
                        habId: hab.id,
                        name: hab.name,
                        durationSec: hab.durationSec !== undefined ? hab.durationSec : 300,
                        completed: hab.completed[selectedDay]
                    });
                });
            });
        }

        function openFocusMode() {
            buildFlatHabits();
            if (flatHabits.length === 0) { alert('실행할 루틴 습관이 없습니다.'); return; }
            let idx = flatHabits.findIndex(h => !h.completed);
            focusIndex = idx !== -1 ? idx : 0;
            
            const modal = document.getElementById('focus-modal');
            modal.classList.remove('hidden');
            setTimeout(() => modal.classList.remove('opacity-0'), 10);
            loadFocusHabit();
        }

        function closeFocusMode() {
            if (focusTimerRef) { clearInterval(focusTimerRef); focusTimerRef = null; }
            focusTimerRunning = false;
            const modal = document.getElementById('focus-modal');
            modal.classList.add('opacity-0');
            setTimeout(() => { modal.classList.add('hidden'); renderSections(); }, 300);
        }

        function loadFocusHabit() {
            if (focusTimerRef) { clearInterval(focusTimerRef); focusTimerRef = null; }
            if (focusIndex >= flatHabits.length) {
                alert('축하합니다! 선택하신 요일의 모든 루틴을 완수했습니다 🎉');
                closeFocusMode();
                return;
            }

            const current = flatHabits[focusIndex];
            document.getElementById('focus-sec-badge').textContent = `${current.secTitle}`;
            document.getElementById('focus-habit-title').textContent = current.name;
            document.getElementById('focus-step-indicator').textContent = `${focusIndex + 1} / ${flatHabits.length} 번째 루틴`;

            focusTimerTotal = Number(current.durationSec) || 300;
            focusTimerSeconds = focusTimerTotal;
            updateFocusTimerView();

            focusTimerRunning = true;
            updateFocusPlayPauseButton();
            
            focusTimerRef = setInterval(() => {
                if (focusTimerSeconds > 0) {
                    focusTimerSeconds--;
                    updateFocusTimerView();
                } else {
                    if (focusTimerRef) { clearInterval(focusTimerRef); focusTimerRef = null; }
                    focusTimerRunning = false;
                    playTimerCompleteBellSound();
                    markFocusCompleteAndNext();
                }
            }, 1000);
        }

        function updateFocusTimerView() {
            const m = Math.floor(focusTimerSeconds / 60);
            const s = focusTimerSeconds % 60;
            document.getElementById('timer-display').textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;

            const circle = document.getElementById('timer-circle');
            if (circle) {
                const circumference = 289;
                const ratio = focusTimerTotal > 0 ? (focusTimerSeconds / focusTimerTotal) : 0;
                circle.style.strokeDashoffset = circumference - (ratio * circumference);
            }
        }

        function toggleTimerPlayPause() {
            if (focusTimerRunning) {
                if (focusTimerRef) { clearInterval(focusTimerRef); focusTimerRef = null; }
                focusTimerRunning = false;
            } else {
                focusTimerRunning = true;
                focusTimerRef = setInterval(() => {
                    if (focusTimerSeconds > 0) {
                        focusTimerSeconds--;
                        updateFocusTimerView();
                    } else {
                        if (focusTimerRef) { clearInterval(focusTimerRef); focusTimerRef = null; }
                        focusTimerRunning = false;
                        playTimerCompleteBellSound();
                        markFocusContentAndNext(); // fallback typo check
                    }
                }, 1000);
            }
            updateFocusPlayPauseButton();
        }

        function updateFocusPlayPauseButton() {
            const icon = document.getElementById('play-pause-icon');
            const text = document.getElementById('play-pause-text');
            if (!icon || !text) return;
            if (focusTimerRunning) {
                icon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
                text.textContent = '일시정지';
            } else {
                icon.innerHTML = '<path d="M8 5v14l11-7z"/>';
                text.textContent = '재생';
            }
        }

        function skipFocusHabit() {
            if (focusTimerRef) { clearInterval(focusTimerRef); focusTimerRef = null; }
            focusIndex++;
            loadFocusHabit();
        }

        function completeFocusAndNext() {
            if (focusTimerRef) { clearInterval(focusTimerRef); focusTimerRef = null; }
            markFocusCompleteAndNext();
        }

        function markFocusCompleteAndNext() {
            const current = flatHabits[focusIndex];
            if (current) {
                const sec = sections.find(s => s.id === current.secId);
                if (sec) {
                    const hab = sec.habits.find(h => h.id === current.habId);
                    if (hab) {
                        if (!hab.completed) hab.completed = {};
                        hab.completed[selectedDay] = true;
                        saveData();
                    }
                }
            }
            focusIndex++;
            loadFocusHabit();
        }

        function saveData() {
            localStorage.setItem('routine_sections', JSON.stringify(sections));
        }
    </script>
</body>
</html>
