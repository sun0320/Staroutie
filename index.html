<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Routie - Daily Routine Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <style>
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, 'Helvetica Neue', 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
            -webkit-tap-highlight-color: transparent;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.1);
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 0, 0, 0.2);
        }

        .btn-effect {
            position: relative;
            overflow: hidden;
            transition: background-color 0.15s ease, filter 0.15s ease;
        }
        .btn-effect:active {
            filter: brightness(0.88);
        }
        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.4);
            transform: scale(0);
            animation: ripple-anim 0.4s linear;
            pointer-events: none;
        }
        @keyframes ripple-anim {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        .habit-row-wrapper, .section-row-wrapper {
            position: relative;
            overflow: hidden;
            border-radius: 0.75rem;
            user-select: none;
            touch-action: pan-y;
            transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
        }
        .habit-row-wrapper.dragging, .section-row-wrapper.dragging {
            opacity: 0.4;
            transform: scale(0.98);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            z-index: 50;
        }
        .habit-row-wrapper.drag-over, .section-row-wrapper.drag-over {
            border-top: 2px dashed var(--accent-color);
        }
        .habit-content-card, .section-content-card {
            position: relative;
            z-index: 2;
            transition: transform 0.15s cubic-bezier(0.25, 1, 0.5, 1);
            background: inherit;
        }
        .habit-actions-container, .section-actions-container {
            position: absolute;
            top: 0;
            bottom: 0;
            right: 0;
            width: 76px;
            display: flex;
            z-index: 1;
            border-radius: 0.75rem;
            overflow: hidden;
            gap: 2px;
            padding: 4px;
            background: rgba(0,0,0,0.03);
        }
        .section-actions-container {
            width: 76px;
        }
        .section-action-btn, .habit-action-btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            cursor: pointer;
        }
        .section-edit-action {
            background-color: #64748b;
            border-radius: 0.75rem 0.3rem 0.3rem 0.75rem;
        }
        .section-delete-action {
            background-color: #ef4444;
            border-radius: 0.3rem 0.75rem 0.75rem 0.3rem;
        }
        .habit-edit-action {
            background-color: #64748b;
            border-radius: 0.5rem 0.2rem 0.2rem 0.5rem;
        }
        .habit-delete-action {
            background-color: #ef4444;
            border-radius: 0.2rem 0.5rem 0.5rem 0.2rem;
        }
    </style>
</head>
<body class="transition-colors duration-300 min-h-screen flex flex-col items-center justify-start py-8 px-4 sm:px-6" id="body-bg">
    <div class="w-full max-w-md flex flex-col min-h-[85vh] pb-24 relative">
        
        <header class="flex items-center justify-between mb-6 px-1">
            <div class="flex items-center space-x-3.5">
                <div onclick="document.getElementById('app-image-input').click()" id="app-icon-container" class="w-18 h-18 rounded-2xl overflow-hidden border border-stone-200 shadow-xs flex items-center justify-center cursor-pointer transition-transform hover:scale-105 shrink-0 bg-white btn-effect">
                </div>
                <input type="file" id="app-image-input" accept="image/*" onchange="handleAppImageUpload(event)" class="hidden">

                <div>
                    <h1 class="text-xs font-medium tracking-widest opacity-80" id="header-subtitle">Daily Routine</h1>
                    <h2 class="text-lg font-bold tracking-tight opacity-95" id="header-title">Routie</h2>
                </div>
            </div>

            <!-- Theme Switcher -->
            <div class="flex items-center space-x-2">
                <div class="flex items-center space-x-1.5 bg-white p-1.5 rounded-full shadow-xs border border-stone-200">
                    <button onclick="setTheme('lavender')" class="w-4 h-4 rounded-full bg-purple-200 hover:scale-110 transition-transform cursor-pointer border border-purple-300 btn-effect" title="Lavender"></button>
                    <button onclick="setTheme('pink')" class="w-4 h-4 rounded-full bg-[#f8b4c4] hover:scale-110 transition-transform cursor-pointer border border-[#f59eb2]" title="Pastel Pink"></button>
                    <button onclick="setTheme('mint')" class="w-4 h-4 rounded-full bg-emerald-200 hover:scale-110 transition-transform cursor-pointer border border-emerald-300 btn-effect" title="Mint"></button>
                    <button onclick="setTheme('indigoblue')" class="w-4 h-4 rounded-full bg-[#8fa9c4] hover:scale-110 transition-transform cursor-pointer border border-[#7896b5] btn-effect" title="Indigo Blue"></button>
                    <button onclick="setTheme('stardew')" class="w-4 h-4 rounded-full bg-[#c28859] hover:scale-110 transition-transform cursor-pointer border border-[#b07343] btn-effect" title="Stardew Valley"></button>
                </div>
            </div>
        </header>

        <div class="relative mb-8 px-2">
            <div class="absolute top-1/2 left-6 right-6 -translate-y-1/2 h-0.5 bg-stone-300 z-0" id="day-line"></div>
            
            <div class="relative z-10 flex justify-between items-center" id="day-selector-container">
            </div>
        </div>

        <div class="w-full h-px mb-6 mx-auto" id="main-separator-line"></div>

        <main class="flex-1 flex flex-col space-y-6" id="sections-container">
        </main>

        <!-- Floating Action Button for Focus Mode -->
        <div class="fixed bottom-10 left-1/2 -translate-x-1/2 z-40 flex flex-col items-center pointer-events-none">
            <button onclick="openFocusMode()" id="floating-play-btn" class="pointer-events-auto w-20 h-20 rounded-full shadow-xl flex items-center justify-center text-white transition-all cursor-pointer btn-effect" style="background-color: var(--accent-color);">
                <svg class="w-10 h-10 fill-current ml-0.5" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            </button>
        </div>

        <!-- Floating Action Button for Add Section -->
        <div class="fixed bottom-6 left-6 z-40">
            <button onclick="openAddSectionModal()" id="floating-add-section-btn" class="w-14 h-14 rounded-full shadow-lg flex items-center justify-center text-white transition-all cursor-pointer btn-effect" style="background-color: var(--accent-color);" title="새 섹션 추가하기">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"></path></svg>
            </button>
        </div>

    </div>

    <div id="section-modal" class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl p-6 w-full max-w-sm shadow-xl border border-stone-200 flex flex-col space-y-4">
            <h3 id="section-modal-title" class="text-base font-bold text-stone-800">새 섹션 추가</h3>
            <input type="text" id="section-name-input" placeholder="섹션 이름 (예: Morning Routine)" class="w-full px-4 py-3 rounded-xl border border-stone-200 text-sm focus:outline-none focus:border-stone-400 bg-white">
            
            <div class="flex flex-col space-y-2 pt-1">
                <span class="text-xs font-bold text-stone-700">반복 요일 선택</span>
                <div class="flex justify-between items-center bg-stone-50 p-2.5 rounded-2xl border border-stone-200" id="section-repeat-days-container">
                </div>
            </div>

            <div class="flex space-x-2 pt-2">
                <button onclick="closeSectionModal()" class="flex-1 py-2.5 rounded-xl border border-stone-200 text-stone-600 text-xs font-medium hover:bg-stone-50 cursor-pointer btn-effect">취소</button>
                <button onclick="saveSection()" class="flex-1 py-2.5 rounded-xl text-white text-xs font-medium cursor-pointer btn-effect" id="section-save-btn" style="background-color: var(--accent-color);">저장</button>
            </div>
        </div>
    </div>

    <div id="habit-modal" class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl p-6 w-full max-w-sm shadow-xl border border-stone-200 flex flex-col space-y-4 max-h-[90vh] overflow-y-auto">
            <h3 id="habit-modal-title" class="text-base font-bold text-stone-800">새 습관(루틴) 추가</h3>
            <input type="text" id="habit-name-input" placeholder="습관 이름 (예: 물 한 잔 마시기)" class="w-full px-4 py-3 rounded-xl border border-stone-200 text-sm focus:outline-none focus:border-stone-400 bg-white">
            
            <div class="flex items-center justify-between px-1 pt-1">
                <span class="text-xs font-bold text-stone-700">타이머 시간 설정</span>
                <label class="relative inline-flex items-center cursor-pointer">
                    <input type="checkbox" id="has-timer-checkbox" onchange="toggleTimerSettingsVisibility()" class="sr-only peer" checked>
                    <div class="w-9 h-5 bg-stone-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-stone-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-[var(--accent-color)]"></div>
                </label>
            </div>

            <div id="timer-settings-container" class="grid grid-cols-2 gap-3 bg-stone-50 p-4 rounded-2xl border border-stone-200 transition-all">
                <div class="flex flex-col items-center space-y-1">
                    <label class="text-[11px] font-bold text-stone-600">분 (Minutes)</label>
                    <div class="flex items-center space-x-2">
                        <button type="button" onclick="adjustTime('min', -1)" class="w-8 h-8 rounded-full bg-white border border-stone-300 shadow-xs flex items-center justify-center text-stone-700 font-bold text-sm cursor-pointer hover:bg-stone-100 btn-effect">-</button>
                        <span id="display-min" class="text-lg font-extrabold text-stone-800 w-8 text-center font-mono">05</span>
                        <button type="button" onclick="adjustTime('min', 1)" class="w-8 h-8 rounded-full bg-white border border-stone-300 shadow-xs flex items-center justify-center text-stone-700 font-bold text-sm cursor-pointer hover:bg-stone-100 btn-effect">+</button>
                    </div>
                </div>
                <div class="flex flex-col items-center space-y-1">
                    <label class="text-[11px] font-bold text-stone-600">초 (Seconds)</label>
                    <div class="flex items-center space-x-2">
                        <button type="button" onclick="adjustTime('sec', -5)" class="w-8 h-8 rounded-full bg-white border border-stone-300 shadow-xs flex items-center justify-center text-stone-700 font-bold text-sm cursor-pointer hover:bg-stone-100 btn-effect">-</button>
                        <span id="display-sec" class="text-lg font-extrabold text-stone-800 w-8 text-center font-mono">00</span>
                        <button type="button" onclick="adjustTime('sec', 5)" class="w-8 h-8 rounded-full bg-white border border-stone-300 shadow-xs flex items-center justify-center text-stone-700 font-bold text-sm cursor-pointer hover:bg-stone-100 btn-effect">+</button>
                    </div>
                </div>
            </div>

            <div class="flex flex-col space-y-2 pt-1">
                <span class="text-xs font-bold text-stone-700">반복 요일 선택</span>
                <div class="flex justify-between items-center bg-stone-50 p-2.5 rounded-2xl border border-stone-200" id="habit-repeat-days-container">
                </div>
            </div>

            <div class="flex space-x-2 pt-2">
                <button onclick="closeHabitModal()" class="flex-1 py-2.5 rounded-xl border border-stone-200 text-stone-600 text-xs font-medium hover:bg-stone-50 cursor-pointer btn-effect">취소</button>
                <button onclick="saveHabit()" class="flex-1 py-2.5 rounded-xl text-white text-xs font-medium cursor-pointer btn-effect" id="habit-save-btn" style="background-color: var(--accent-color);">저장</button>
            </div>
        </div>
    </div>

    <div id="focus-modal" class="fixed inset-0 z-50 flex flex-col justify-between p-6 hidden opacity-0 transition-opacity duration-300">
        <div class="max-w-md w-full mx-auto flex items-center justify-between text-white pt-2">
            <div>
                <span id="focus-sec-badge" class="text-xs font-bold uppercase px-3.5 py-1.5 bg-white/10 text-white/90 rounded-full border border-white/10">모닝 루틴</span>
            </div>
            <button onclick="closeFocusMode()" class="w-9 h-9 rounded-xl bg-white/10 hover:bg-white/25 transition flex items-center justify-center text-white cursor-pointer btn-effect">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
        </div>

        <div class="max-w-md w-full mx-auto text-center my-auto text-white px-4">
            <div class="mb-3">
                <span id="focus-step-indicator" class="text-xs font-medium text-white/80 bg-white/10 px-3.5 py-1.5 rounded-full">1 / 3 번째 루틴</span>
            </div>
            <h2 id="focus-habit-title" class="text-2xl sm:text-3xl font-extrabold mb-10 tracking-tight leading-snug">물 한 잔 마시기</h2>
            
            <div class="relative w-52 h-52 mx-auto flex items-center justify-center mb-6">
                <div class="absolute inset-0 rounded-full border-4 border-white/15"></div>
                <svg class="absolute inset-0 w-full h-full -rotate-90" viewBox="0 0 100 100">
                    <circle id="timer-circle" cx="50" cy="50" r="46" fill="none" stroke="#ffffff" stroke-width="4" stroke-dasharray="289" stroke-dashoffset="0" stroke-linecap="round" class="transition-all duration-1000 ease-linear"/>
                </svg>
                <div class="text-center z-10">
                    <div id="timer-display" class="text-4xl sm:text-5xl font-extrabold font-mono tracking-tight text-white">05:00</div>
                    <div class="text-xs text-white/70 mt-1">집중 타이머</div>
                </div>
            </div>
        </div>

        <div class="max-w-md w-full mx-auto flex items-center justify-center space-x-3 pb-6">
            <button onclick="skipFocusHabit()" class="px-4 py-3 rounded-2xl bg-white/10 hover:bg-white/20 text-white font-medium text-xs transition cursor-pointer btn-effect">
                건너뛰기
            </button>
            <button id="timer-toggle-btn" onclick="toggleTimerPlayPause()" class="px-6 py-3.5 rounded-2xl bg-white text-slate-800 font-bold text-xs shadow-lg hover:bg-slate-50 transition flex items-center space-x-2 cursor-pointer btn-effect">
                <svg id="play-pause-icon" class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                <span id="play-pause-text">일시정지</span>
            </button>
            <button onclick="completeFocusAndNext()" id="focus-done-btn" class="px-5 py-3.5 rounded-2xl text-white font-bold text-xs shadow-lg transition cursor-pointer btn-effect">
                완료 & 다음 ➔
            </button>
        </div>
    </div>

    <script>
        document.addEventListener('click', function(e) {
            const target = e.target.closest('button, .btn-effect');
            if (!target) return;

            playBubblePopSound();

            const rect = target.getBoundingClientRect();
            const ripple = document.createElement('span');
            ripple.className = 'ripple';
            const size = Math.max(rect.width, rect.height);
            ripple.style.width = ripple.style.height = `${size}px`;
            ripple.style.left = `${e.clientX - rect.left - size / 2}px`;
            ripple.style.top = `${e.clientY - rect.top - size / 2}px`;
            target.appendChild(ripple);
            setTimeout(() => ripple.remove(), 400);
        });

        let audioCtx = null;
        function playBubblePopSound() {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                const startFreq = 420 + Math.random() * 180;
                const endFreq = 90 + Math.random() * 30;

                osc.type = 'sine';
                osc.frequency.setValueAtTime(startFreq, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(endFreq, audioCtx.currentTime + 0.05);

                gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 0.05);
            } catch (e) {}
        }

        function playSwitchClickSound() {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'triangle';
                osc.frequency.setValueAtTime(900, now);
                osc.frequency.exponentialRampToValueAtTime(350, now + 0.03);

                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.03);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start(now);
                osc.stop(now + 0.03);
            } catch (e) {}
        }

        function playTimerCompleteBellSound() {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                const now = audioCtx.currentTime;
                const frequencies = [523.25, 659.25, 783.99, 1046.50];

                frequencies.forEach((freq, index) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();

                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now + index * 0.06);

                    gain.gain.setValueAtTime(0, now + index * 0.06);
                    gain.gain.linearRampToValueAtTime(0.12, now + index * 0.06 + 0.02);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + index * 0.06 + 0.9);

                    osc.connect(gain);
                    gain.connect(audioCtx.destination);

                    osc.start(now + index * 0.06);
                    osc.stop(now + index * 0.06 + 0.9);
                });
            } catch (e) {}
        }

        const themes = {
            lavender: {
                name: 'Lavender',
                bg: '#FAF8FC',
                accent: '#9D8EC9',
                accentLight: '#EDE8F5',
                complementary: '#C9A98E',
                text: '#4A4556',
                timerBg: '#6B5B95'
            },
            pink: {
                name: 'Pastel Pink',
                bg: '#FFF2F5',
                accent: '#e88f9f',
                accentLight: '#fde8ec',
                complementary: '#7aa894',
                text: '#5A3D44',
                timerBg: '#D96B7D'
            },
            mint: {
                name: 'Mint',
                bg: '#F4F9F6',
                accent: '#7AA894',
                accentLight: '#E3EFE9',
                complementary: '#E8907A',
                text: '#3E4D45',
                timerBg: '#5A8C74'
            },
            indigoblue: {
                name: 'Indigo Blue',
                bg: '#31446b',
                accent: '#4e6d94',
                accentLight: '#e4edf7',
                complementary: '#e09b5a',
                text: '#e2e8f0',
                subText: '#94a3b8',
                headerText: '#ffffff',
                cardBg: '#f6f8fb',
                cardBorder: '#cbd5e1',
                timerBg: '#1E293B'
            },
            stardew: {
                name: 'Stardew Valley',
                bg: "url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ8Q54dSWWE1R9n0JetR1F7nneZQBdg1OI_2TpUonVA7A&s')",
                accent: '#d48357',
                accentLight: '#fef3e2',
                complementary: '#73956f',
                cardBg: '#ffffff',
                text: '#3d261c',
                subText: '#5c3a21',
                headerText: '#2e1c14',
                icon: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRNV-KUbny80BbPqdaXdIpl2Q1Kh4qmdwk0OTw78VL8Yg&s',
                timerBg: '#5C4033'
            }
        };

        const daysOfWeek = [
            { key: 'mon', label: 'M', fullName: '월' },
            { key: 'tue', label: 'T', fullName: '화' },
            { key: 'wed', label: 'W', fullName: '수' },
            { key: 'thu', label: 'T', fullName: '목' },
            { key: 'fri', label: 'F', fullName: '금' },
            { key: 'sat', label: 'S', fullName: '토' },
            { key: 'sun', label: 'S', fullName: '일' }
        ];

        let currentTheme = localStorage.getItem('routine_theme') || 'lavender';
        
        function getDefaultDay() {
            const jsDay = new Date().getDay();
            const map = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];
            return map[jsDay] || 'mon';
        }
        let selectedDay = localStorage.getItem('routine_selected_day') || getDefaultDay();
        let appCustomImage = localStorage.getItem('routine_app_image') || null;
        let sections = JSON.parse(localStorage.getItem('routine_sections')) || [
            {
                id: 'sec_1',
                name: 'Morning Routine',
                repeatDays: { mon: true, tue: true, wed: true, thu: true, fri: true, sat: true, sun: true },
                habits: [
                    { id: 'hab_1', name: '물 한 잔 마시기', durationSec: 180, repeatDays: { mon: true, tue: true, wed: true, thu: true, fri: true, sat: true, sun: true }, completed: { mon: true, tue: false, wed: false, thu: false, fri: false, sat: false, sun: false } },
                    { id: 'hab_2', name: '가벼운 스트레칭 10분', durationSec: 600, repeatDays: { mon: true, tue: true, wed: true, thu: true, fri: true, sat: true, sun: true }, completed: { mon: false, tue: false, wed: false, thu: false, fri: false, sat: false, sun: false } }
                ]
            },
            {
                id: 'sec_2',
                name: 'Daily Study & Work',
                repeatDays: { mon: true, tue: true, wed: true, thu: true, fri: true, sat: true, sun: true },
                habits: [

            const theme = themes[themeKey] || themes.lavender;
            document.documentElement.style.setProperty('--accent-color', theme.accent);
            document.documentElement.style.setProperty('--accent-light', theme.accentLight);

            if (focusDoneBtn) focusDoneBtn.style.backgroundColor = theme.accent;

            if (focusModal) {
                focusModal.style.backgroundColor = theme.timerBg || '#0f172a';

            if (themeKey === 'stardew') {

                body.style.backgroundColor = '#faedcd';

            if (m > 0) return `${m}분`;
            return `${s}초`;

        let activeSwipeHabitId = null;
        let habitSwipeStartX = 0;
        let habitSwipeStartY = 0;
        let isHabitSwiping = false;
        let isHabitDragging = false;
        let habitLongPressTimer = null;
        let draggedHabitId = null;
        const maxHabitSwipeWidth = -76;

        let activeSwipeSectionId = null;
        let sectionSwipeStartX = 0;
        let sectionSwipeStartY = 0;
        let isSectionSwiping = false;
        let isSectionDragging = false;
        let sectionLongPressTimer = null;
        let draggedSectionId = null;
        const maxSectionSwipeWidth = -76;

        function handleHabitTouchStart(e, habitId) {
            e.stopPropagation();
            const touch = e.touches[0];
            habitSwipeStartX = touch.clientX;
            habitSwipeStartY = touch.clientY;
            isHabitSwiping = true;
            isHabitDragging = false;

            if (activeSwipeHabitId && activeSwipeHabitId !== habitId) {
                closeActiveHabitSwipe();
            }

            habitLongPressTimer = setTimeout(() => {
                if (isHabitSwiping) {
                    isHabitSwiping = false;
                    isHabitDragging = true;
                    draggedHabitId = habitId;
                    playSwitchClickSound();
                    const wrap = document.getElementById(`habit-wrap-${habitId}`);
                    if (wrap) wrap.classList.add('dragging');
                }
            }, 400);
        }

        function handleHabitTouchMove(e, habitId) {
            e.stopPropagation();
            if (isHabitDragging) {
                const touch = e.touches[0];
                const elem = document.elementFromPoint(touch.clientX, touch.clientY);
                const targetWrap = elem ? elem.closest('.habit-row-wrapper') : null;
                document.querySelectorAll('.habit-row-wrapper').forEach(el => el.classList.remove('drag-over'));
                if (targetWrap && targetWrap.dataset.habitId !== habitId) {
                    targetWrap.classList.add('drag-over');
                }
                return;
            }

            if (!isHabitSwiping) return;
            const touch = e.touches[0];
            const diffX = touch.clientX - habitSwipeStartX;
            const diffY = touch.clientY - habitSwipeStartY;

            if (Math.abs(diffY) > 8 && Math.abs(diffY) > Math.abs(diffX)) {
                clearTimeout(habitLongPressTimer);
                isHabitSwiping = false;
                return;
            }

            if (Math.abs(diffX) > 4) {
                clearTimeout(habitLongPressTimer);
            }

            let newTranslate = diffX;
            if (newTranslate > 0) newTranslate = 0;
            if (newTranslate < maxHabitSwipeWidth - 15) newTranslate = maxHabitSwipeWidth - 15;

            const card = document.getElementById(`habit-card-${habitId}`);
            if (card) card.style.transform = `translateX(${newTranslate}px)`;
        }

        function handleHabitTouchEnd(e, habitId) {
            e.stopPropagation();
            clearTimeout(habitLongPressTimer);

            if (isHabitDragging) {
                isHabitDragging = false;
                const touch = e.changedTouches[0];
                const elem = document.elementFromPoint(touch.clientX, touch.clientY);
                const targetWrap = elem ? elem.closest('.habit-row-wrapper') : null;
                document.querySelectorAll('.habit-row-wrapper').forEach(el => {
                    el.classList.remove('dragging');
                    el.classList.remove('drag-over');
                });

                if (targetWrap && targetWrap.dataset.habitId !== draggedHabitId) {
                    reorderHabits(draggedHabitId, targetWrap.dataset.habitId);
                }
                draggedHabitId = null;
                return;
            }

            if (!isHabitSwiping) return;
            isHabitSwiping = false;
            const card = document.getElementById(`habit-card-${habitId}`);
            if (!card) return;

            const matrix = window.getComputedStyle(card).transform;
            let currentX = 0;
            if (matrix !== 'none') {
                const values = matrix.split(', ');
                currentX = parseFloat(values[4]) || 0;
            }

            if (currentX < -20) {
                card.style.transform = `translateX(${maxHabitSwipeWidth}px)`;
                activeSwipeHabitId = habitId;
                playSwitchClickSound();
            } else {
                card.style.transform = 'translateX(0px)';
                if (activeSwipeHabitId === habitId) activeSwipeHabitId = null;
            }
        }

        function handleHabitMouseDown(e, habitId) {
            e.stopPropagation();
            habitSwipeStartX = e.clientX;
            habitSwipeStartY = e.clientY;
            isHabitSwiping = true;
            isHabitDragging = false;

            if (activeSwipeHabitId && activeSwipeHabitId !== habitId) {
                closeActiveHabitSwipe();
            }

            habitLongPressTimer = setTimeout(() => {
                if (isHabitSwiping) {
                    isHabitSwiping = false;
                    isHabitDragging = true;
                    draggedHabitId = habitId;
                    playSwitchClickSound();
                    const wrap = document.getElementById(`habit-wrap-${habitId}`);
                    if (wrap) wrap.classList.add('dragging');
                }
            }, 400);
        }

        function handleHabitMouseMove(e, habitId) {
            e.stopPropagation();
            if (isHabitDragging) {
                const elem = document.elementFromPoint(e.clientX, e.clientY);
                const targetWrap = elem ? elem.closest('.habit-row-wrapper') : null;
                document.querySelectorAll('.habit-row-wrapper').forEach(el => el.classList.remove('drag-over'));
                if (targetWrap && targetWrap.dataset.habitId !== habitId) {
                    targetWrap.classList.add('drag-over');
                }
                return;
            }

            if (!isHabitSwiping) return;
            const diffX = e.clientX - habitSwipeStartX;
            const diffY = e.clientY - habitSwipeStartY;

            if (Math.abs(diffY) > 8 && Math.abs(diffY) > Math.abs(diffX)) {
                clearTimeout(habitLongPressTimer);
                isHabitSwiping = false;
                return;
            }

            if (Math.abs(diffX) > 4) {
                clearTimeout(habitLongPressTimer);
            }

            let newTranslate = diffX;
            if (newTranslate > 0) newTranslate = 0;
            if (newTranslate < maxHabitSwipeWidth - 15) newTranslate = maxHabitSwipeWidth - 15;

            const card = document.getElementById(`habit-card-${habitId}`);
            if (card) card.style.transform = `translateX(${newTranslate}px)`;
        }

        function handleHabitMouseUp(e, secId, habitId) {
            e.stopPropagation();
            clearTimeout(habitLongPressTimer);

            if (isHabitDragging) {
                isHabitDragging = false;
                const elem = document.elementFromPoint(e.clientX, e.clientY);
                const targetWrap = elem ? elem.closest('.habit-row-wrapper') : null;
                document.querySelectorAll('.habit-row-wrapper').forEach(el => {
                    el.classList.remove('dragging');
                    el.classList.remove('drag-over');
                });

                if (targetWrap && targetWrap.dataset.habitId !== draggedHabitId) {
                    reorderHabits(draggedHabitId, targetWrap.dataset.habitId);
                }
                draggedHabitId = null;
                return;
            }

            if (!isHabitSwiping) return;
            isHabitSwiping = false;
            const card = document.getElementById(`habit-card-${habitId}`);
            if (!card) return;

            const matrix = window.getComputedStyle(card).transform;
            let currentX = 0;
            if (matrix !== 'none') {
                const values = matrix.split(', ');
                currentX = parseFloat(values[4]) || 0;
            }

            if (currentX < -20) {
                card.style.transform = `translateX(${maxHabitSwipeWidth}px)`;
                activeSwipeHabitId = habitId;
                playSwitchClickSound();
            } else {
                card.style.transform = 'translateX(0px)';
                if (activeSwipeHabitId === habitId) activeSwipeHabitId = null;
            }
        }

        function closeActiveHabitSwipe() {
            if (!activeSwipeHabitId) return;
            const card = document.getElementById(`habit-card-${activeSwipeHabitId}`);
            if (card) card.style.transform = 'translateX(0px)';
            activeSwipeHabitId = null;
        }

        function handleSectionTouchStart(e, secId) {
            const touch = e.touches[0];
            sectionSwipeStartX = touch.clientX;
            sectionSwipeStartY = touch.clientY;
            isSectionSwiping = true;
            isSectionDragging = false;

            if (activeSwipeSectionId && activeSwipeSectionId !== secId) {
                closeActiveSectionSwipe();
            }

            sectionLongPressTimer = setTimeout(() => {
                if (isSectionSwiping) {
                    isSectionSwiping = false;
                    isSectionDragging = true;
                    draggedSectionId = secId;
                    playSwitchClickSound();
                    const wrap = document.getElementById(`section-wrap-${secId}`);
                    if (wrap) wrap.classList.add('dragging');
                }
            }, 450);
        }

        function handleSectionTouchMove(e, secId) {
            if (isSectionDragging) {
                const touch = e.touches[0];
                const elem = document.elementFromPoint(touch.clientX, touch.clientY);
                const targetWrap = elem ? elem.closest('.section-row-wrapper') : null;
                document.querySelectorAll('.section-row-wrapper').forEach(el => el.classList.remove('drag-over'));
                if (targetWrap && targetWrap.dataset.sectionId !== secId) {
                    targetWrap.classList.add('drag-over');
                }
                return;
            }

            if (!isSectionSwiping) return;
            const touch = e.touches[0];
            const diffX = touch.clientX - sectionSwipeStartX;
            const diffY = touch.clientY - sectionSwipeStartY;

            if (Math.abs(diffY) > 12 && Math.abs(diffY) > Math.abs(diffX)) {
                clearTimeout(sectionLongPressTimer);
                isSectionSwiping = false;
                return;
            }

            if (Math.abs(diffX) > 8) {
                clearTimeout(sectionLongPressTimer);
            }

            let newTranslate = diffX;
            if (newTranslate > 0) newTranslate = 0;
            if (newTranslate < maxSectionSwipeWidth - 15) newTranslate = maxSectionSwipeWidth - 15;

            const card = document.getElementById(`section-card-${secId}`);
            if (card) card.style.transform = `translateX(${newTranslate}px)`;
        }

        function handleSectionTouchEnd(e, secId) {
            clearTimeout(sectionLongPressTimer);

            if (isSectionDragging) {
                isSectionDragging = false;
                const touch = e.changedTouches[0];
                const elem = document.elementFromPoint(touch.clientX, touch.clientY);
                const targetWrap = elem ? elem.closest('.section-row-wrapper') : null;
                document.querySelectorAll('.section-row-wrapper').forEach(el => {
                    el.classList.remove('dragging');
                    el.classList.remove('drag-over');
                });

                if (targetWrap && targetWrap.dataset.sectionId !== draggedSectionId) {
                    reorderSections(draggedSectionId, targetWrap.dataset.sectionId);
                }
                draggedSectionId = null;
                return;
            }

            if (!isSectionSwiping) return;
            isSectionSwiping = false;
            const card = document.getElementById(`section-card-${secId}`);
            if (!card) return;

            const matrix = window.getComputedStyle(card).transform;
            let currentX = 0;
            if (matrix !== 'none') {
                const values = matrix.split(', ');
                currentX = parseFloat(values[4]) || 0;
            }

            if (currentX < -25) {
                card.style.transform = `translateX(${maxSectionSwipeWidth}px)`;
                activeSwipeSectionId = secId;
                playSwitchClickSound();
            } else {
                card.style.transform = 'translateX(0px)';
                if (activeSwipeSectionId === secId) activeSwipeSectionId = null;
            }
        }

        function handleSectionMouseDown(e, secId) {
            sectionSwipeStartX = e.clientX;
            sectionSwipeStartY = e.clientY;
            isSectionSwiping = true;
            isSectionDragging = false;

            if (activeSwipeSectionId && activeSwipeSectionId !== secId) {
                closeActiveSectionSwipe();
            }

            sectionLongPressTimer = setTimeout(() => {
                if (isSectionSwiping) {
                    isSectionSwiping = false;
                    isSectionDragging = true;
                    draggedSectionId = secId;
                    playSwitchClickSound();
                    const wrap = document.getElementById(`section-wrap-${secId}`);
                    if (wrap) wrap.classList.add('dragging');
                }
            }, 450);
        }

        function handleSectionMouseMove(e, secId) {
            if (isSectionDragging) {
                const elem = document.elementFromPoint(e.clientX, e.clientY);
                const targetWrap = elem ? elem.closest('.section-row-wrapper') : null;
                document.querySelectorAll('.section-row-wrapper').forEach(el => el.classList.remove('drag-over'));
                if (targetWrap && targetWrap.dataset.sectionId !== secId) {
                    targetWrap.classList.add('drag-over');
                }
                return;
            }

            if (!isSectionSwiping) return;
            const diffX = e.clientX - sectionSwipeStartX;
            const diffY = e.clientY - sectionSwipeStartY;

            if (Math.abs(diffY) > 12 && Math.abs(diffY) > Math.abs(diffX)) {
                clearTimeout(sectionLongPressTimer);
                isSectionSwiping = false;
                return;
            }

            if (Math.abs(diffX) > 8) {
                clearTimeout(sectionLongPressTimer);
            }

            let newTranslate = diffX;
            if (newTranslate > 0) newTranslate = 0;
            if (newTranslate < maxSectionSwipeWidth - 15) newTranslate = maxSectionSwipeWidth - 15;

            const card = document.getElementById(`section-card-${secId}`);
            if (card) card.style.transform = `translateX(${newTranslate}px)`;
        }

        function handleSectionMouseUp(e, secId) {
            clearTimeout(sectionLongPressTimer);

            if (isSectionDragging) {
                isSectionDragging = false;
                const elem = document.elementFromPoint(e.clientX, e.clientY);
                const targetWrap = elem ? elem.closest('.section-row-wrapper') : null;
                document.querySelectorAll('.section-row-wrapper').forEach(el => {
                    el.classList.remove('dragging');
                    el.classList.remove('drag-over');
                });

                if (targetWrap && targetWrap.dataset.sectionId !== draggedSectionId) {
                    reorderSections(draggedSectionId, targetWrap.dataset.sectionId);
                }
                draggedSectionId = null;
                return;
            }

            if (!isSectionSwiping) return;
            isSectionSwiping = false;
            const card = document.getElementById(`section-card-${secId}`);
            if (!card) return;

            const matrix = window.getComputedStyle(card).transform;
            let currentX = 0;
            if (matrix !== 'none') {
                const values = matrix.split(', ');
                currentX = parseFloat(values[4]) || 0;
            }

            if (currentX < -25) {
                card.style.transform = `translateX(${maxSectionSwipeWidth}px)`;
                activeSwipeSectionId = secId;
                playSwitchClickSound();
            } else {
                card.style.transform = 'translateX(0px)';
                if (activeSwipeSectionId === secId) activeSwipeSectionId = null;
            }
        }

        function closeActiveSectionSwipe() {
            if (!activeSwipeSectionId) return;
            const card = document.getElementById(`section-card-${activeSwipeSectionId}`);
            if (card) card.style.transform = 'translateX(0px)';
            activeSwipeSectionId = null;
        }

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.habit-row-wrapper')) {
                closeActiveHabitSwipe();
            }
            if (!e.target.closest('.section-row-wrapper')) {
                closeActiveSectionSwipe();
            }
        });

        function reorderHabits(srcHabitId, targetHabitId) {
            let foundSourceSec = null;
            let sourceHabitIndex = -1;
            let targetHabitIndex = -1;
            let targetSec = null;

            sections.forEach(sec => {
                const sIdx = sec.habits.findIndex(h => h.id === srcHabitId);
                if (sIdx !== -1) {
                    foundSourceSec = sec;
                    sourceHabitIndex = sIdx;
                }
                const tIdx = sec.habits.findIndex(h => h.id === targetHabitId);
                if (tIdx !== -1) {
                    targetSec = sec;
                    targetHabitIndex = tIdx;
                }
            });

            if (!foundSourceSec || !targetSec || sourceHabitIndex === -1 || targetHabitIndex === -1) return;

            const [movedHabit] = foundSourceSec.habits.splice(sourceHabitIndex, 1);
            targetSec.habits.splice(targetHabitIndex, 0, movedHabit);

            playSwitchClickSound();
            saveSectionsData();
            renderSections();
        }

        function reorderSections(srcSecId, targetSecId) {
            const srcIdx = sections.findIndex(s => s.id === srcSecId);
            const targetIdx = sections.findIndex(s => s.id === targetSecId);
            if (srcIdx === -1 || targetIdx === -1) return;

            const [movedSec] = sections.splice(srcIdx, 1);
            sections.splice(targetIdx, 0, movedSec);

            playSwitchClickSound();
            saveSectionsData();
            renderSections();
        }

        function saveSectionsData() {
            localStorage.setItem('routine_sections', JSON.stringify(sections));
        }

        function toggleHabitComplete(secId, habId) {
            const sec = sections.find(s => s.id === secId);
            if (!sec) return;
            const hab = sec.habits.find(h => h.id === habId);
            if (!hab) return;

            if (!hab.completed) {
                hab.completed = { mon: false, tue: false, wed: false, thu: false, fri: false, sat: false, sun: false };
            }
            hab.completed[selectedDay] = !hab.completed[selectedDay];
            saveSectionsData();
            renderSections();
        }

        function deleteHabit(secId, habId) {
            const sec = sections.find(s => s.id === secId);
            if (!sec) return;
            sec.habits = sec.habits.filter(h => h.id !== habId);
            saveSectionsData();
            renderSections();
        }

        function deleteSection(secId) {
            if (!confirm('정말 이 섹션을 삭제하시겠습니까?')) return;
            sections = sections.filter(s => s.id !== secId);
            saveSectionsData();
            renderSections();
        }

        function openAddSectionModal() {
            editingSectionId = null;
            document.getElementById('section-modal-title').innerText = '새 섹션 추가';
            document.getElementById('section-name-input').value = '';
            tempSectionRepeatDays = { mon: true, tue: true, wed: true, thu: true, fri: true, sat: true, sun: true };
            renderRepeatDaysSelectorHTML('section-repeat-days-container', tempSectionRepeatDays);
            document.getElementById('section-modal').classList.remove('hidden');
        }

        function openEditSectionModal(secId) {
            const sec = sections.find(s => s.id === secId);
            if (!sec) return;
            editingSectionId = secId;
            document.getElementById('section-modal-title').innerText = '섹션 수정';
            document.getElementById('section-name-input').value = sec.name;
            tempSectionRepeatDays = sec.repeatDays ? { ...sec.repeatDays } : { mon: true, tue: true, wed: true, thu: true, fri: true, sat: true, sun: true };
            renderRepeatDaysSelectorHTML('section-repeat-days-container', tempSectionRepeatDays);
            document.getElementById('section-modal').classList.remove('hidden');
        }

        function closeSectionModal() {
            document.getElementById('section-modal').classList.add('hidden');
        }

        function saveSection() {
            const nameInput = document.getElementById('section-name-input');
            const name = nameInput.value.trim();
            if (!name) return;

            if (editingSectionId) {
                const sec = sections.find(s => s.id === editingSectionId);
                if (sec) {
                    sec.name = name;
                    sec.repeatDays = { ...tempSectionRepeatDays };
                }
            } else {
                const newSec = {
                    id: 'sec_' + Date.now(),
                    name: name,
                    repeatDays: { ...tempSectionRepeatDays },
                    habits: []
                };
                sections.push(newSec);
            }

            saveSectionsData();
            closeSectionModal();
            renderSections();
        }

        function openAddHabitModal(secId) {
            activeSectionIdForHabit = secId;
            editingHabitId = null;
            document.getElementById('habit-modal-title').innerText = '새 습관(루틴) 추가';
            document.getElementById('habit-name-input').value = '';
            document.getElementById('has-timer-checkbox').checked = true;
            toggleTimerSettingsVisibility();

            dialMinutes = 5;
            dialSeconds = 0;
            updateDialDisplay();

            tempHabitRepeatDays = { mon: true, tue: true, wed: true, thu: true, fri: true, sat: true, sun: true };
            renderRepeatDaysSelectorHTML('habit-repeat-days-container', tempHabitRepeatDays);

            document.getElementById('habit-modal').classList.remove('hidden');
        }

        function openEditHabitModal(secId, habId) {
            const sec = sections.find(s => s.id === secId);
            if (!sec) return;
            const hab = sec.habits.find(h => h.id === habId);
            if (!hab) return;

            activeSectionIdForHabit = secId;
            editingHabitId = habId;
            document.getElementById('habit-modal-title').innerText = '습관(루틴) 수정';
            document.getElementById('habit-name-input').value = hab.name;

            const hasTimer = hab.durationSec > 0;
            document.getElementById('has-timer-checkbox').checked = hasTimer;
            toggleTimerSettingsVisibility();

            dialMinutes = Math.floor((hab.durationSec || 0) / 60);
            dialSeconds = (hab.durationSec || 0) % 60;
            updateDialDisplay();

            tempHabitRepeatDays = hab.repeatDays ? { ...hab.repeatDays } : { mon: true, tue: true, wed: true, thu: true, fri: true, sat: true, sun: true };
            renderRepeatDaysSelectorHTML('habit-repeat-days-container', tempHabitRepeatDays);

            document.getElementById('habit-modal').classList.remove('hidden');
        }

        function closeHabitModal() {
            document.getElementById('habit-modal').classList.add('hidden');
        }

        function toggleTimerSettingsVisibility() {
            const isChecked = document.getElementById('has-timer-checkbox').checked;
            const container = document.getElementById('timer-settings-container');
            if (isChecked) {
                container.classList.remove('opacity-40', 'pointer-events-none');
            } else {
                container.classList.add('opacity-40', 'pointer-events-none');
            }
        }

        function adjustTime(type, amount) {
            if (type === 'min') {
                dialMinutes = Math.max(0, dialMinutes + amount);
            } else {
                dialSeconds = Math.max(0, Math.min(55, dialSeconds + amount));
            }
            updateDialDisplay();
        }

        function updateDialDisplay() {
            document.getElementById('display-min').innerText = String(dialMinutes).padStart(2, '0');
            document.getElementById('display-sec').innerText = String(dialSeconds).padStart(2, '0');
        }

        function saveHabit() {
            const nameInput = document.getElementById('habit-name-input');
            const name = nameInput.value.trim();
            if (!name) return;

            const hasTimer = document.getElementById('has-timer-checkbox').checked;
            const durationSec = hasTimer ? (dialMinutes * 60 + dialSeconds) : 0;

            const sec = sections.find(s => s.id === activeSectionIdForHabit);
            if (!sec) return;

            if (editingHabitId) {
                const hab = sec.habits.find(h => h.id === editingHabitId);
                if (hab) {
                    hab.name = name;
                    hab.durationSec = durationSec;
                    hab.repeatDays = { ...tempHabitRepeatDays };
                }
            } else {
                const newHabit = {
                    id: 'hab_' + Date.now(),
                    name: name,
                    durationSec: durationSec,
                    repeatDays: { ...tempHabitRepeatDays },
                    completed: { mon: false, tue: false, wed: false, thu: false, fri: false, sat: false, sun: false }
                };
                sec.habits.push(newHabit);
            }

            saveSectionsData();
            closeHabitModal();
            renderSections();
        }

        function openFocusMode() {
            flatHabits = [];
            sections.forEach(sec => {
                if (!sec.repeatDays || sec.repeatDays[selectedDay] !== false) {
                    sec.habits.forEach(hab => {
                        if ((!hab.repeatDays || hab.repeatDays[selectedDay] !== false) && hab.durationSec > 0) {
                            flatHabits.push({ secName: sec.name, secId: sec.id, habit: hab });
                        }
                    });
                }
            });

            if (flatHabits.length === 0) {
                alert('오늘 실행할 타이머 설정된 루틴이 없습니다!');
                return;
            }

            focusIndex = 0;
            startFocusItem(focusIndex);

            const modal = document.getElementById('focus-modal');
            modal.classList.remove('hidden');
            setTimeout(() => modal.classList.remove('opacity-0'), 10);
        }

        function startFocusItem(index) {
            if (focusTimerRef) clearInterval(focusTimerRef);
            if (index >= flatHabits.length) {
                closeFocusMode();
                return;
            }

            const item = flatHabits[index];
            document.getElementById('focus-sec-badge').innerText = item.secName;
            document.getElementById('focus-step-indicator').innerText = `${index + 1} / ${flatHabits.length} 번째 루틴`;
            document.getElementById('focus-habit-title').innerText = item.habit.name;

            focusTimerTotal = item.habit.durationSec;
            focusTimerSeconds = focusTimerTotal;
            focusTimerRunning = true;
            updateFocusDisplayUI();

            focusTimerRef = setInterval(() => {
                if (!focusTimerRunning) return;
                if (focusTimerSeconds > 0) {
                    focusTimerSeconds--;
                    updateFocusDisplayUI();
                    if (focusTimerSeconds === 0) {
                        playTimerCompleteBellSound();
                        clearInterval(focusTimerRef);
                        autoCompleteAndNext();
                    }
                }
            }, 1000);
        }

        function updateFocusDisplayUI() {
            const m = Math.floor(focusTimerSeconds / 60);
            const s = focusTimerSeconds % 60;
            document.getElementById('timer-display').innerText = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;

            const circle = document.getElementById('timer-circle');
            const radius = 46;
            const circumference = 2 * Math.PI * radius;
            const progress = circumference - (focusTimerSeconds / focusTimerTotal) * circumference;
            circle.style.strokeDasharray = circumference;
            circle.style.strokeDashoffset = progress;

            const playText = document.getElementById('play-pause-text');
            playText.innerText = focusTimerRunning ? '일시정지' : '재개';
        }

        function toggleTimerPlayPause() {
            focusTimerRunning = !focusTimerRunning;
            updateFocusDisplayUI();
        }

        function skipFocusHabit() {
            focusIndex++;
            startFocusItem(focusIndex);
        }

        function completeFocusAndNext() {
            const item = flatHabits[focusIndex];
            if (item) {
                const sec = sections.find(s => s.id === item.secId);
                if (sec) {
                    const hab = sec.habits.find(h => h.id === item.habit.id);
                    if (hab) {
                        if (!hab.completed) hab.completed = {};
                        hab.completed[selectedDay] = true;
                        saveSectionsData();
                        renderSections();
                    }
                }
            }
            focusIndex++;
            startFocusItem(focusIndex);
        }

        function autoCompleteAndNext() {
            completeFocusAndNext();
        }

        function closeFocusMode() {
            if (focusTimerRef) clearInterval(focusTimerRef);
            const modal = document.getElementById('focus-modal');
            modal.classList.add('opacity-0');
            setTimeout(() => {
                modal.classList.add('hidden');
                renderSections();
            }, 300);
        }
    </script>
</body>
</html>
