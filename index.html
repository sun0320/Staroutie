<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>routie - Cozy Pastel Diary v3.0</title>
    <link href="https://fonts.googleapis.com/css2?family=DungGeunMo&family=Press+Start+2P&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Theme Variables */
        :root {
            --brand-bg: #FDFBF7;
            --brand-primary: #DDA7A5;
            --brand-secondary: #E8C5C8;
            --brand-accent: #C98886;
            --brand-tab-bg: #F7EDEC;
            --brand-border: #E8D7D3;
            --text-main: #4A403A;
            --text-sub: #8C7875;
        }

        /* Theme Variations */
        body.theme-pink {
            --brand-bg: #FDFBF7;
            --brand-primary: #DDA7A5;
            --brand-secondary: #E8C5C8;
            --brand-accent: #C98886;
            --brand-tab-bg: #F7EDEC;
            --brand-border: #E8D7D3;
            --text-main: #4A403A;
            --text-sub: #8C7875;
        }

        body.theme-mint {
            --brand-bg: #F7FAF8;
            --brand-primary: #8AB8A8;
            --brand-secondary: #B4D3C5;
            --brand-accent: #6C9A89;
            --brand-tab-bg: #EAF3EF;
            --brand-border: #D1E5DE;
            --text-main: #344A42;
            --text-sub: #6A8A7E;
        }

        body.theme-lavender {
            --brand-bg: #FAFAFC;
            --brand-primary: #A3A1C2;
            --brand-secondary: #C8C6E3;
            --brand-accent: #817FA3;
            --brand-tab-bg: #EFEFF5;
            --brand-border: #D9D7ED;
            --text-main: #3F3E54;
            --text-sub: #7A7896;
        }

        body.theme-peach {
            --brand-bg: #FFFCF9;
            --brand-primary: #E8A87C;
            --brand-secondary: #F4C4A8;
            --brand-accent: #CC8A5E;
            --brand-tab-bg: #FDF2EC;
            --brand-border: #F5DEC9;
            --text-main: #543E31;
            --text-sub: #967460;
        }

        body {
            background-color: var(--brand-bg);
            color: var(--text-main);
            min-height: 100vh;
            font-family: 'DungGeunMo', monospace, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0.5rem;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .pixelated-img {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        .app-shell {
            background-color: #FFFFFF;
            border: 2px solid var(--brand-border);
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 420px;
            height: 95vh;
            max-height: 900px;
            transition: border-color 0.3s ease;
        }

        .header-wooden-banner {
            position: relative;
            background-size: cover;
            background-position: center;
            border-bottom: 2px solid var(--brand-border);
            overflow: hidden;
            background-color: var(--brand-tab-bg);
            transition: border-color 0.3s ease;
            padding-top: 1.75rem;
            padding-bottom: 1.75rem;
        }

        .header-wooden-banner::after {
            content: '';
            position: absolute;
            inset: 0;
            background-color: rgba(255, 255, 255, 0.45);
            pointer-events: none;
            z-index: 1;
        }

        .header-content {
            position: relative;
            z-index: 2;
        }

        .flat-routine-item {
            background-color: transparent;
            border-bottom: 1px solid var(--brand-border);
            transition: all 0.2s ease;
        }
        .flat-routine-item:hover {
            background-color: rgba(0, 0, 0, 0.02);
        }

        .refined-tab {
            background-color: var(--brand-tab-bg);
            border: 1px solid var(--brand-border);
            color: var(--text-sub);
            transition: all 0.2s ease;
            border-radius: 9999px !important;
        }
        .refined-tab.active {
            background-color: var(--brand-primary);
            color: #FFFFFF;
            border-color: var(--brand-accent);
            font-weight: 900;
        }

        .modal-backdrop {
            background-color: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
        }
        .modal-card {
            background-color: #FFFFFF;
            border: 1px solid var(--brand-border);
            box-shadow: 0 20px 30px -10px rgba(0,0,0,0.1);
            color: var(--text-main);
        }

        .borderless-btn {
            background: transparent;
            border: none;
            outline: none;
            box-shadow: none;
        }
        .borderless-btn:hover {
            opacity: 0.8;
        }

        .pixel-logo-font {
            font-family: 'Press Start 2P', monospace;
            letter-spacing: -1px;
        }

        .brand-text-accent { color: var(--brand-accent); }
        .brand-bg-accent { background-color: var(--brand-primary); color: #FFFFFF; }
        .brand-bg-accent:hover { background-color: var(--brand-accent); }

        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--brand-border); border-radius: 2px; }

        @keyframes celebrationGlow {
            0% { box-shadow: 0 0 5px var(--brand-secondary); }
            50% { box-shadow: 0 0 20px var(--brand-primary); }
            100% { box-shadow: 0 0 5px var(--brand-secondary); }
        }
        .celebration-active {
            animation: celebrationGlow 1.5s infinite;
        }
    </style>
</head>
<body class="theme-pink">
    <div class="app-shell rounded-2xl overflow-hidden flex flex-col relative">
        
        <!-- Header Banner -->
        <header id="header-banner" class="header-wooden-banner px-6 py-6 shrink-0 flex flex-col gap-4">
            <div class="header-content flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-12 h-12 flex items-center justify-center shrink-0 overflow-hidden rounded-md bg-white/95 shadow-sm">
                        <canvas id="header-canvas" width="64" height="64" class="w-full h-full pixelated-img rounded-md"></canvas>
                    </div>
                    <div>
                        <div class="flex items-center gap-1.5">
                            <h1 class="text-xl font-black tracking-widest pixel-logo-font drop-shadow-sm" style="color: var(--text-main);">rou<span class="brand-text-accent">tie</span></h1>
                            <span class="px-1.5 py-0.5 text-[9px] brand-bg-accent rounded font-bold uppercase tracking-tighter">v3.0</span>
                        </div>
                        <p class="text-[11px] mt-1 font-bold drop-shadow-sm brand-text-accent" id="current-date">로딩중...</p>
                    </div>
                </div>
                <div class="flex gap-1 items-center">
                    <button onclick="openThemeModal()" class="borderless-btn p-2 brand-text-accent transition active:scale-95 flex items-center justify-center" title="테마 변경">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
                            <path d="M8 9.5a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3z"/>
                            <path d="M14 4.5V14a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V4.5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2zM3 4.5v9.5a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V4.5a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1z"/>
                        </svg>
                    </button>
                    <button onclick="openSettingsModal()" class="borderless-btn p-2 brand-text-accent transition active:scale-95 flex items-center justify-center" title="설정 및 백업">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
                            <path d="M9.405 1.05c-.413-1.4-2.397-1.4-2.81 0l-.1.34a1.464 1.464 0 0 1-2.105.872l-.31-.17c-1.283-.698-2.686.705-1.988 1.988l.169.311c.446.82.023 1.841-.87 2.105l-.34.1c-1.4.413-1.4 2.397 0 2.81l.34.1a1.464 1.464 0 0 1 .872 2.105l-.17.31c-.698 1.283.705 2.686 1.988 1.988l.311-.169a1.464 1.464 0 0 1 2.105.872l.1.34c.413 1.4 2.397 1.4 2.81 0l.1-.34a1.464 1.464 0 0 1 2.105-.872l.31.17c1.283.698 2.686-.705 1.988-1.988l-.169-.311a1.464 1.464 0 0 1 .87-2.105l.34-.1c1.4-.413 1.4-2.397 0-2.81l-.34-.1a1.464 1.464 0 0 1-.872-2.105l.17-.31c.698-1.283-.705-2.686-1.988-1.988l-.311.169a1.464 1.464 0 0 1-2.105-.872l-.1-.34zM8 10.93a2.93 2.93 0 1 1 0-5.86 2.93 2.93 0 0 1 0 5.86z"/>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Progress Box -->
            <div id="header-progress-box" class="header-content bg-white/95 rounded-xl p-3 flex flex-col gap-1.5 shadow-sm backdrop-blur-sm transition-all duration-300" style="border: 1px solid var(--brand-border);">
                <div class="flex justify-between items-center text-xs font-black">
                    <span id="progress-title-label" style="color: var(--text-main);">오늘의 루틴 달성률</span>
                    <span id="progress-text" class="brand-text-accent text-sm font-black">0%</span>
                </div>
                <div class="w-full h-2 rounded-full overflow-hidden p-0.5" style="background-color: var(--brand-tab-bg); border: 1px solid var(--brand-border);">
                    <div id="progress-bar" class="brand-bg-accent h-full w-0 transition-all duration-700 ease-out rounded-full shadow-sm"></div>
                </div>
            </div>
        </header>

        <!-- Section Tabs -->
        <div class="px-4 pt-2.5 flex gap-1.5 overflow-x-auto shrink-0" id="section-tabs" style="background-color: var(--brand-tab-bg); border-bottom: 1px solid var(--brand-border);">
            <!-- Dynamic Tabs -->
        </div>

        <!-- Main Content -->
        <main class="px-4 py-3.5 flex-1 overflow-y-auto flex flex-col gap-2" style="background-color: var(--brand-bg);">
            <div class="flex justify-between items-center mb-1.5 pb-1.5" style="border-bottom: 1px solid var(--brand-border);">
                <div class="flex items-center gap-2">
                    <h2 id="active-section-title" class="font-black text-sm" style="color: var(--text-main);">로딩중...</h2>
                    <span id="active-section-count" class="text-[10px] font-bold px-2 py-0.5 rounded-full brand-text-accent" style="background-color: var(--brand-tab-bg); border: 1px solid var(--brand-border);">0개</span>
                </div>
                <div class="flex gap-1 items-center">
                    <button onclick="resetSectionChecks()" class="text-[10px] font-bold px-2 py-1.5 rounded-lg transition hover:scale-105 active:scale-95" style="background-color: var(--brand-tab-bg); border: 1px solid var(--brand-border); color: var(--text-sub);" title="오늘 체크 초기화">
                        초기화
                    </button>
                    <button onclick="openRoutineModalForAdd()" class="text-[11px] font-bold px-2.5 py-1.5 brand-bg-accent rounded-lg shadow-sm transition hover:scale-105 active:scale-95">
                        + 루틴
                    </button>
                    <button onclick="openModal('section-modal')" class="text-[11px] font-bold px-2.5 py-1.5 rounded-lg transition hover:scale-105 active:scale-95" style="background-color: var(--brand-tab-bg); border: 1px solid var(--brand-border); color: var(--text-main);">
                        + 섹션
                    </button>
                    <button onclick="deleteCurrentSection()" class="text-[11px] font-bold px-2 py-1.5 bg-rose-50 hover:bg-rose-100 text-rose-500 transition hover:scale-105 active:scale-95 border border-rose-200 rounded-lg" title="현재 섹션 삭제">
                        삭제
                    </button>
                </div>
            </div>

            <!-- Routine List -->
            <div id="routine-list" class="flex flex-col pb-4">
            </div>
        </main>

        <!-- Footer Button (Clean circle without text) -->
        <footer class="p-3.5 bg-white shrink-0 flex justify-center" style="border-top: 1px solid var(--brand-border);">
            <button onclick="startRoutines()" class="w-12 h-12 brand-bg-accent font-black rounded-full shadow-md transition hover:brightness-105 active:scale-[0.98] flex items-center justify-center text-base" title="오늘의 루틴 시작하기">
                <span>▶</span>
            </button>
        </footer>
        
        <!-- Notification Modal -->
        <div id="notification-modal" class="fixed inset-0 modal-backdrop hidden items-center justify-center z-[100] p-4 opacity-0 transition-opacity">
            <div class="modal-card rounded-2xl p-5 w-[80%] max-w-xs shadow-xl flex flex-col gap-3 text-center transform scale-95 transition-transform" id="notification-content">
                <h3 id="notif-title" class="font-black text-base" style="color: var(--text-main);">알림</h3>
                <p id="notif-desc" class="text-xs font-bold" style="color: var(--text-sub);">내용</p>
                <button onclick="closeNotification()" class="mt-1 py-2.5 brand-bg-accent rounded-xl text-xs font-black active:scale-95 transition shadow-sm">확인</button>
            </div>
        </div>

        <!-- Add Section Modal -->
        <div id="section-modal" class="fixed inset-0 modal-backdrop hidden items-center justify-center z-50 p-4">
            <div class="modal-card rounded-2xl p-5 w-full max-w-xs shadow-xl flex flex-col gap-3">
                <h3 class="font-black text-sm" style="color: var(--text-main);">새 루틴 섹션 추가</h3>
                <input type="text" id="new-section-name" placeholder="예: 오후 루틴" class="px-3.5 py-2.5 text-xs rounded-xl focus:outline-none transition font-bold" style="background-color: var(--brand-bg); border: 1px solid var(--brand-border); color: var(--text-main);">
                <div class="flex gap-2 mt-1">
                    <button onclick="closeModal('section-modal')" class="flex-1 py-2.5 rounded-xl text-xs font-bold transition" style="background-color: var(--brand-tab-bg); color: var(--text-sub);">취소</button>
                    <button onclick="addSection()" class="flex-1 py-2.5 brand-bg-accent rounded-xl text-xs font-black active:scale-95 transition shadow-sm">추가하기</button>
                </div>
            </div>
        </div>

        <!-- Add/Edit Routine Modal -->
        <div id="routine-modal" class="fixed inset-0 modal-backdrop hidden items-center justify-center z-50 p-4">
            <div class="modal-card rounded-2xl p-5 w-full max-w-xs shadow-xl flex flex-col gap-3">
                <h3 id="routine-modal-title" class="font-black text-sm" style="color: var(--text-main);">새 루틴 추가</h3>
                <input type="hidden" id="edit-routine-id" value="">
                <div class="flex flex-col gap-2.5">
                    <div>
                        <label class="text-[10px] font-bold mb-1 block ml-0.5" style="color: var(--text-sub);">루틴 이름</label>
                        <input type="text" id="new-routine-title" placeholder="예: 물 한잔 마시기" class="w-full px-3.5 py-2.5 text-xs rounded-xl focus:outline-none transition font-bold" style="background-color: var(--brand-bg); border: 1px solid var(--brand-border); color: var(--text-main);">
                    </div>
                    <div>
                        <label class="text-[10px] font-bold mb-1 block ml-0.5" style="color: var(--text-sub);">소요 시간 (분)</label>
                        <input type="number" id="new-routine-duration" value="5" min="1" class="w-full px-3.5 py-2.5 text-xs rounded-xl focus:outline-none transition font-bold" style="background-color: var(--brand-bg); border: 1px solid var(--brand-border); color: var(--text-main);">
                    </div>
                </div>
                <div class="flex gap-2 mt-1">
                    <button onclick="closeModal('routine-modal')" class="flex-1 py-2.5 rounded-xl text-xs font-bold transition" style="background-color: var(--brand-tab-bg); color: var(--text-sub);">취소</button>
                    <button onclick="saveRoutineHandler()" id="routine-modal-submit-btn" class="flex-1 py-2.5 brand-bg-accent rounded-xl text-xs font-black active:scale-95 transition shadow-sm">추가하기</button>
                </div>
            </div>
        </div>

        <!-- Theme Selection Modal -->
        <div id="theme-modal" class="fixed inset-0 modal-backdrop hidden items-center justify-center z-50 p-4">
            <div class="modal-card rounded-2xl p-5 w-full max-w-xs shadow-xl flex flex-col gap-4">
                <div class="flex justify-between items-center pb-2" style="border-bottom: 1px solid var(--brand-border);">
                    <h3 class="font-black text-sm" style="color: var(--text-main);">파스텔 테마 선택</h3>
                    <button onclick="closeModal('theme-modal')" class="text-xs font-bold" style="color: var(--text-sub);">✕ 닫기</button>
                </div>
                <div class="grid grid-cols-2 gap-2.5">
                    <button onclick="setTheme('theme-pink')" class="p-3 rounded-xl border flex flex-col items-center gap-1.5 transition hover:scale-105 active:scale-95" style="background-color: #FDFBF7; border-color: #E8D7D3;">
                        <span class="w-6 h-6 rounded-full bg-[#DDA7A5] shadow-sm"></span>
                        <span class="text-xs font-bold" style="color: #4A403A;">파스텔 핑크</span>
                    </button>
                    <button onclick="setTheme('theme-mint')" class="p-3 rounded-xl border flex flex-col items-center gap-1.5 transition hover:scale-105 active:scale-95" style="background-color: #F7FAF8; border-color: #D1E5DE;">
                        <span class="w-6 h-6 rounded-full bg-[#8AB8A8] shadow-sm"></span>
                        <span class="text-xs font-bold" style="color: #344A42;">파스텔 민트</span>
                    </button>
                    <button onclick="setTheme('theme-lavender')" class="p-3 rounded-xl border flex flex-col items-center gap-1.5 transition hover:scale-105 active:scale-95" style="background-color: #FAFAFC; border-color: #D9D7ED;">
                        <span class="w-6 h-6 rounded-full bg-[#A3A1C2] shadow-sm"></span>
                        <span class="text-xs font-bold" style="color: #3F3E54;">파스텔 라벤더</span>
                    </button>
                    <button onclick="setTheme('theme-peach')" class="p-3 rounded-xl border flex flex-col items-center gap-1.5 transition hover:scale-105 active:scale-95" style="background-color: #FFFCF9; border-color: #F5DEC9;">
                        <span class="w-6 h-6 rounded-full bg-[#E8A87C] shadow-sm"></span>
                        <span class="text-xs font-bold" style="color: #543E31;">파스텔 피치</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Immersive Timer Modal -->
        <div id="timer-modal" class="fixed inset-0 modal-backdrop hidden flex-col z-[110] p-4 justify-between bg-white/95">
            <div class="flex justify-between items-center w-full max-w-sm mx-auto pt-2">
                <div class="flex items-center gap-2">
                    <span class="text-xs font-bold brand-text-accent px-2.5 py-1 rounded-lg" id="timer-progress-indicator" style="background-color: var(--brand-tab-bg); border: 1px solid var(--brand-border);">1 / 3</span>
                    <span class="text-xs font-bold" style="color: var(--text-sub);" id="timer-section-label">모닝 루틴</span>
                </div>
                <button onclick="closeTimerModal()" class="w-8 h-8 rounded-lg flex items-center justify-center font-bold transition" style="background-color: var(--brand-tab-bg); color: var(--text-main);">✕</button>
            </div>

            <div class="flex flex-col items-center justify-center text-center my-auto gap-6 max-w-sm mx-auto w-full">
                <div class="flex flex-col gap-2">
                    <h3 id="timer-routine-title" class="text-lg font-black leading-snug" style="color: var(--text-main);">루틴 이름</h3>
                    <p class="text-xs brand-text-accent">집중해서 완료해보세요!</p>
                </div>

                <div class="relative w-48 h-48 rounded-full border-4 flex flex-col items-center justify-center shadow-inner" style="border-color: var(--brand-border); background-color: var(--brand-bg);">
                    <div id="timer-clock-display" class="text-4xl font-black tracking-wider" style="color: var(--text-main);">05:00</div>
                    <div id="timer-status-text" class="text-[10px] font-bold mt-1" style="color: var(--text-sub);">대기 중</div>
                </div>

                <div class="flex items-center gap-3 w-full justify-center">
                    <button onclick="toggleTimerPlay()" id="timer-play-btn" class="px-6 py-3 brand-bg-accent font-black rounded-xl shadow-md transition hover:scale-105 active:scale-95 text-xs">
                        ▶ 시작
                    </button>
                    <button onclick="completeCurrentTimerRoutine()" class="px-5 py-3 bg-[#94A3B8] hover:bg-[#8292A6] text-white font-black rounded-xl shadow-md transition hover:scale-105 active:scale-95 text-xs">
                        ✓ 완료 처리
                    </button>
                </div>
            </div>

            <div class="w-full max-w-sm mx-auto pb-4 flex justify-between">
                <button onclick="prevTimerRoutine()" class="px-4 py-2 rounded-xl text-xs font-bold transition" style="background-color: var(--brand-tab-bg); color: var(--text-sub);">◀ 이전</button>
                <button onclick="nextTimerRoutine()" class="px-4 py-2 rounded-xl text-xs font-bold transition" style="background-color: var(--brand-tab-bg); color: var(--text-main);">다음 ▶</button>
            </div>
        </div>

        <!-- Settings & Backup Modal -->
        <div id="settings-modal" class="fixed inset-0 modal-backdrop hidden items-center justify-center z-50 p-4">
            <div class="modal-card rounded-2xl p-5 w-full max-w-xs shadow-xl flex flex-col gap-4">
                <div class="flex justify-between items-center pb-2" style="border-bottom: 1px solid var(--brand-border);">
                    <h3 class="font-black text-sm" style="color: var(--text-main);">데이터 관리 및 백업</h3>
                    <button onclick="closeModal('settings-modal')" class="text-xs font-bold" style="color: var(--text-sub);">✕ 닫기</button>
                </div>
                <div class="flex flex-col gap-3">
                    <div>
                        <p class="text-[11px] font-bold mb-1.5" style="color: var(--text-sub);">JSON 백업 내보내기</p>
                        <button onclick="exportDataJSON()" class="w-full py-2.5 rounded-xl text-xs font-bold transition" style="background-color: var(--brand-tab-bg); color: var(--text-main);">
                            📥 백업 파일 다운로드
                        </button>
                    </div>
                    <div>
                        <p class="text-[11px] font-bold mb-1.5" style="color: var(--text-sub);">JSON 백업 가져오기</p>
                        <input type="file" id="import-file-input" accept=".json" onchange="importDataJSON(event)" class="hidden">
                        <button onclick="document.getElementById('import-file-input').click()" class="w-full py-2.5 rounded-xl text-xs font-bold transition" style="background-color: var(--brand-tab-bg); color: var(--text-main);">
                            📤 백업 파일 복원하기
                        </button>
                    </div>
                    <div class="pt-3" style="border-top: 1px solid var(--brand-border);">
                        <p class="text-[10px] text-rose-500 font-bold mb-1.5">초기화 경고</p>
                        <button onclick="resetAllData()" class="w-full py-2.5 bg-rose-50 hover:bg-rose-100 text-rose-600 rounded-xl text-xs font-bold transition border border-rose-200">
                            🔄 전체 데이터 초기화
                        </button>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        const HEADER_BANNER_URL = 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTn9Kt5APOiHR5MN7r1Qmpe04ll6q072-C91mtyYnfUzA&s';
        const HEADER_ICON_URL = 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQag3NQ_QBPs5SmoQjYV-FeLpZNYyaSKF87XE1EOdvYlw&s';

        let appData = {
            activeSection: '모닝 루틴',
            currentTheme: 'theme-pink',
            lastDateChecked: '',
            sections: [
                {
                    name: '모닝 루틴',
                    routines: [
                        { id: 1, title: '기상 직후 미온수 한 잔 마시기', duration: 2, completed: false },
                        { id: 2, title: '가벼운 전신 스트레칭 및 환기', duration: 10, completed: false }
                    ]
                },
                {
                    name: '나이트 루틴',
                    routines: [
                        { id: 3, title: '방 안 정리정돈 및 책상 청소', duration: 10, completed: false },
                        { id: 4, title: '내일 일정 및 투두리스트 점검', duration: 5, completed: false }
                    ]
                }
            ]
        };

        let timerQueue = [];
        let currentTimerIndex = 0;
        let timerSecondsLeft = 0;
        let timerInterval = null;
        let isTimerRunning = false;

        function init() {
            const savedData = localStorage.getItem('routie_habit_app_data_v30');
            if (savedData) {
                try {
                    appData = JSON.parse(savedData);
                } catch(e) {}
            }

            applyTheme(appData.currentTheme || 'theme-pink');
            checkDailyReset();
            renderDate();
            setupHeaderBackground();
            setupHeaderIcon();
            setupKeyboardShortcuts();
            renderApp();
        }

        function setTheme(themeName) {
            appData.currentTheme = themeName;
            applyTheme(themeName);
            closeModal('theme-modal');
            saveData(false);
        }

        function applyTheme(themeName) {
            document.body.className = themeName;
        }

        function checkDailyReset() {
            const todayStr = new Date().toDateString();
            if (appData.lastDateChecked && appData.lastDateChecked !== todayStr) {
                appData.sections.forEach(sec => {
                    sec.routines.forEach(r => { r.completed = false; });
                });
            }
            appData.lastDateChecked = todayStr;
            saveData(false);
        }

        function setupHeaderBackground() {
            const banner = document.getElementById('header-banner');
            banner.style.backgroundImage = `url('${HEADER_BANNER_URL}')`;
        }

        function setupHeaderIcon() {
            const canvas = document.getElementById('header-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const img = new Image();
            img.crossOrigin = "anonymous";
            img.src = HEADER_ICON_URL;
            
            img.onload = () => {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                
                try {
                    const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const data = imgData.data;
                    
                    for (let i = 0; i < data.length; i += 4) {
                        const r = data[i];
                        const g = data[i + 1];
                        const b = data[i + 2];
                        
                        if (r > 230 && g > 230 && b > 230) {
                            data[i + 3] = 0;
                        }
                    }
                    ctx.putImageData(imgData, 0, 0);
                } catch(e) {}
            };
        }

        function setupKeyboardShortcuts() {
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    const routineModal = document.getElementById('routine-modal');
                    const sectionModal = document.getElementById('section-modal');
                    
                    if (routineModal && !routineModal.classList.contains('hidden')) {
                        saveRoutineHandler();
                    } else if (sectionModal && !sectionModal.classList.contains('hidden')) {
                        addSection();
                    }
                }
            });
        }

        function renderDate() {
            const now = new Date();
            const days = ['일', '월', '화', '수', '목', '금', '토'];
            const dateEl = document.getElementById('current-date');
            if (dateEl) {
                dateEl.innerText = `${now.getFullYear()}년 ${now.getMonth()+1}월 ${now.getDate()}일 ${days[now.getDay()]}요일`;
            }
        }

        function saveData(shouldRender = true) {
            localStorage.setItem('routie_habit_app_data_v30', JSON.stringify(appData));
            if (shouldRender) renderApp();
        }

        function renderApp() {
            const tabsContainer = document.getElementById('section-tabs');
            if (!tabsContainer) return;
            tabsContainer.innerHTML = '';
            
            appData.sections.forEach(sec => {
                const isSelected = sec.name === appData.activeSection;
                const btn = document.createElement('button');
                btn.className = `px-4 py-2 text-[11px] font-bold rounded-full transition whitespace-nowrap outline-none refined-tab ${
                    isSelected ? 'active' : ''
                }`;
                btn.innerText = sec.name;
                btn.onclick = () => {
                    appData.activeSection = sec.name;
                    renderApp();
                };
                tabsContainer.appendChild(btn);
            });

            let currentSec = appData.sections.find(s => s.name === appData.activeSection);
            
            if (!currentSec && appData.sections.length > 0) {
                currentSec = appData.sections[0];
                appData.activeSection = currentSec.name;
            } else if (!currentSec) {
                document.getElementById('active-section-title').innerText = '섹션 없음';
                document.getElementById('active-section-count').innerText = '0개';
                document.getElementById('routine-list').innerHTML = `<div class="text-center py-10 text-xs font-bold" style="color: var(--text-sub);">+ 섹션 버튼을 눌러 추가해주세요.</div>`;
                updateProgress(0, 0);
                return;
            }

            document.getElementById('active-section-title').innerText = currentSec.name;
            document.getElementById('active-section-count').innerText = `${currentSec.routines.length}개`;

            const listContainer = document.getElementById('routine-list');
            listContainer.innerHTML = '';

            if (currentSec.routines.length === 0) {
                listContainer.innerHTML = `<div class="text-center py-12 text-xs font-bold" style="color: var(--text-sub);">등록된 루틴이 없습니다.<br>+ 루틴 버튼을 눌러 추가해보세요!</div>`;
            } else {
                currentSec.routines.forEach(routine => {
                    const item = document.createElement('div');
                    item.className = `py-3 px-2.5 rounded-lg flat-routine-item flex items-center justify-between group ${
                        routine.completed ? 'opacity-40 grayscale-[0.2]' : ''
                    }`;
                    
                    item.innerHTML = `
                        <div class="flex items-center gap-3 flex-1 cursor-pointer" onclick="toggleRoutine(${routine.id})">
                            <div class="relative flex items-center justify-center w-5 h-5 shrink-0">
                                <input type="checkbox" ${routine.completed ? 'checked' : ''} class="w-5 h-5 appearance-none border-2 rounded-md transition-colors cursor-pointer bg-white" style="border-color: var(--brand-primary); accent-color: var(--brand-primary);">
                                ${routine.completed ? '<span class="absolute text-white text-xs pointer-events-none font-black">✓</span>' : ''}
                            </div>
                            <div class="flex flex-col flex-1">
                                <h3 class="font-bold text-xs ${routine.completed ? 'line-through text-stone-400' : ''}" style="color: ${routine.completed ? '' : 'var(--text-main);'}">${routine.title}</h3>
                                <p class="text-[10px] font-bold mt-0.5" style="color: var(--text-sub);">⏱️ ${routine.duration}분</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-1 shrink-0 ml-1">
                            <button onclick="openRoutineModalForEdit(${routine.id})" class="p-2 rounded-lg transition" style="color: var(--text-sub);" title="루틴 수정">
                                <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" fill="currentColor" viewBox="0 0 16 16"><path d="M12.146.146a.5.5 0 0 1 .708 0l3 3a.5.5 0 0 1 0 .708l-10 10a.5.5 0 0 1-.168.11l-5 2a.5.5 0 0 1-.65-.65l2-5a.5.5 0 0 1 .11-.168l10-10zM11.207 2.5 13.5 4.793 14.793 3.5 12.5 1.207 11.207 2.5zm1.586 3L10.5 3.207 4 9.707V10h.5a.5.5 0 0 1 .5.5v.5h.5a.5.5 0 0 1 .5.5v.5h.293l6.5-6.5zm-9.761 5.175-.106.106-1.528 3.821 3.821-1.528.106-.106A.5.5 0 0 1 5 12.5V12h-.5a.5.5 0 0 1-.5-.5V11h-.5a.5.5 0 0 1-.468-.325z"/></svg>
                            </button>
                            <button onclick="deleteRoutine(${routine.id})" class="text-stone-400 hover:text-rose-500 hover:bg-rose-50 p-2 rounded-lg transition" title="루틴 삭제">
                                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" viewBox="0 0 16 16"><path d="M5.5 5.5A.5.5 0 0 1 6 6v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5zm2.5 0a.5.5 0 0 1 .5.5v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5zm3 .5a.5.5 0 0 0-1 0v6a.5.5 0 0 0 1 0V6z"/><path fill-rule="evenodd" d="M14.5 3a1 1 0 0 1-1 1H13v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4h-.5a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1H6a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1h3.5a1 1 0 0 1 1 1v1zM4.118 4 4 4.059V13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4.059L11.882 4H4.118zM2.5 3V2h11v1h-11z"/></svg>
                            </button>
                        </div>
                    `;
                    listContainer.appendChild(item);
                });
            }

            const total = currentSec.routines.length;
            const completed = currentSec.routines.filter(r => r.completed).length;
            updateProgress(completed, total);
        }

        function updateProgress(completed, total) {
            const percent = total > 0 ? Math.round((completed / total) * 100) : 0;
            document.getElementById('progress-text').innerText = `${percent}%`;
            document.getElementById('progress-bar').style.width = `${percent}%`;

            const progressBox = document.getElementById('header-progress-box');
            const titleLabel = document.getElementById('progress-title-label');

            if (percent === 100 && total > 0) {
                progressBox.classList.add('celebration-active');
                titleLabel.innerText = '✨ 오늘의 루틴 완벽 달성! 🎉';
            } else {
                progressBox.classList.remove('celebration-active');
                titleLabel.innerText = '오늘의 루틴 달성률';
            }
        }

        function toggleRoutine(id) {
            const currentSec = appData.sections.find(s => s.name === appData.activeSection);
            if (!currentSec) return;
            const routine = currentSec.routines.find(r => r.id === id);
            if (routine) {
                routine.completed = !routine.completed;
                saveData();
            }
        }

        function resetSectionChecks() {
            const currentSec = appData.sections.find(s => s.name === appData.activeSection);
            if (!currentSec) return;
            currentSec.routines.forEach(r => r.completed = false);
            saveData();
            showNotification('초기화 완료', `[${currentSec.name}]의 체크 상태가 초기화되었습니다.`);
        }

        function deleteRoutine(id) {
            const currentSec = appData.sections.find(s => s.name === appData.activeSection);
            if (!currentSec) return;
            currentSec.routines = currentSec.routines.filter(r => r.id !== id);
            saveData();
        }

        function deleteCurrentSection() {
            if (appData.sections.length <= 1) {
                showNotification('삭제 불가', '최소 1개의 섹션은 유지해야 합니다.');
                return;
            }
            const index = appData.sections.findIndex(s => s.name === appData.activeSection);
            if (index > -1) {
                appData.sections.splice(index, 1);
                appData.activeSection = appData.sections[0].name;
                saveData();
            }
        }

        function openModal(id) {
            const modal = document.getElementById(id);
            if (!modal) return;
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            
            if(id === 'section-modal') {
                const input = document.getElementById('new-section-name');
                if (input) {
                    input.value = '';
                    setTimeout(() => input.focus(), 50);
                }
            }
        }

        function closeModal(id) {
            const modal = document.getElementById(id);
            if (!modal) return;
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        function openThemeModal() {
            openModal('theme-modal');
        }

        function openRoutineModalForAdd() {
            document.getElementById('routine-modal-title').innerText = '새 루틴 추가';
            document.getElementById('edit-routine-id').value = '';
            document.getElementById('new-routine-title').value = '';
            document.getElementById('new-routine-duration').value = '5';
            document.getElementById('routine-modal-submit-btn').innerText = '추가하기';
            openModal('routine-modal');
            setTimeout(() => document.getElementById('new-routine-title').focus(), 50);
        }

        function openRoutineModalForEdit(id) {
            const currentSec = appData.sections.find(s => s.name === appData.activeSection);
            if (!currentSec) return;
            const routine = currentSec.routines.find(r => r.id === id);
            if (!routine) return;

            document.getElementById('routine-modal-title').innerText = '루틴 수정';
            document.getElementById('edit-routine-id').value = routine.id;
            document.getElementById('new-routine-title').value = routine.title;
            document.getElementById('new-routine-duration').value = routine.duration;
            document.getElementById('routine-modal-submit-btn').innerText = '수정하기';
            openModal('routine-modal');
            setTimeout(() => document.getElementById('new-routine-title').focus(), 50);
        }

        function saveRoutineHandler() {
            const editId = document.getElementById('edit-routine-id').value;
            const title = document.getElementById('new-routine-title').value.trim();
            const duration = parseInt(document.getElementById('new-routine-duration').value) || 5;

            if (!title) return showNotification('입력 오류', '루틴 이름을 입력해주세요.');

            const currentSec = appData.sections.find(s => s.name === appData.activeSection);
            if (!currentSec) {
                closeModal('routine-modal');
                return showNotification('오류', '섹션을 먼저 추가해주세요.');
            }

            if (editId) {
                const routine = currentSec.routines.find(r => r.id == editId);
                if (routine) {
                    routine.title = title;
                    routine.duration = duration;
                }
            } else {
                currentSec.routines.push({
                    id: Date.now(),
                    title: title,
                    duration: duration,
                    completed: false
                });
            }

            closeModal('routine-modal');
            saveData();
        }

        function showNotification(title, message) {
            document.getElementById('notif-title').innerText = title;
            document.getElementById('notif-desc').innerText = message;
            const modal = document.getElementById('notification-modal');
            const content = document.getElementById('notification-content');
            
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                content.classList.remove('scale-95');
            }, 10);
        }

        function closeNotification() {
            const modal = document.getElementById('notification-modal');
            const content = document.getElementById('notification-content');
            
            modal.classList.add('opacity-0');
            content.classList.add('scale-95');
            
            setTimeout(() => {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }, 200);
        }

        function addSection() {
            const name = document.getElementById('new-section-name').value.trim();
            if (!name) return showNotification('입력 오류', '섹션 이름을 입력해주세요.');
            if (appData.sections.some(s => s.name === name)) return showNotification('중복 오류', '이미 존재하는 섹션 이름입니다.');

            appData.sections.push({ name: name, routines: [] });
            appData.activeSection = name;
            closeModal('section-modal');
            saveData();
        }

        function startRoutines() {
            const currentSec = appData.sections.find(s => s.name === appData.activeSection);
            if (!currentSec) return;
            
            timerQueue = currentSec.routines.filter(r => !r.completed);
            if (timerQueue.length === 0) {
                timerQueue = [...currentSec.routines];
            }

            if (timerQueue.length === 0) {
                showNotification('알림', '시작할 루틴이 없습니다. 루틴을 먼저 추가해주세요.');
                return;
            }

            currentTimerIndex = 0;
            openTimerModal();
        }

        function openTimerModal() {
            const modal = document.getElementById('timer-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            loadTimerRoutine(currentTimerIndex);
        }

        function closeTimerModal() {
            stopTimerInterval();
            const modal = document.getElementById('timer-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            renderApp();
        }

        function loadTimerRoutine(index) {
            stopTimerInterval();
            if (index < 0 || index >= timerQueue.length) {
                closeTimerModal();
                showNotification('축하합니다! 🎉', '현재 섹션의 모든 루틴을 완료했습니다!');
                return;
            }

            currentTimerIndex = index;
            const routine = timerQueue[currentTimerIndex];
            
            document.getElementById('timer-progress-indicator').innerText = `${currentTimerIndex + 1} / ${timerQueue.length}`;
            document.getElementById('timer-section-label').innerText = appData.activeSection;
            document.getElementById('timer-routine-title').innerText = routine.title;
            
            timerSecondsLeft = (routine.duration || 5) * 60;
            updateTimerDisplay();
            
            document.getElementById('timer-status-text').innerText = '대기 중';
            document.getElementById('timer-play-btn').innerText = '▶ 시작';
            isTimerRunning = false;
        }

        function updateTimerDisplay() {
            const mins = Math.floor(timerSecondsLeft / 60);
            const secs = timerSecondsLeft % 60;
            document.getElementById('timer-clock-display').innerText = 
                `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }

        function toggleTimerPlay() {
            if (isTimerRunning) {
                stopTimerInterval();
                document.getElementById('timer-status-text').innerText = '일시정지됨';
                document.getElementById('timer-play-btn').innerText = '▶ 계속';
                isTimerRunning = false;
            } else {
                startTimerInterval();
                document.getElementById('timer-status-text').innerText = '집중 타이머 작동 중...';
                document.getElementById('timer-play-btn').innerText = '⏸ 일시정지';
                isTimerRunning = true;
            }
        }

        function startTimerInterval() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (timerSecondsLeft > 0) {
                    timerSecondsLeft--;
                    updateTimerDisplay();
                } else {
                    stopTimerInterval();
                    document.getElementById('timer-status-text').innerText = '시간 완료!';
                    markCurrentRoutineCompleteAndAdvance();
                }
            }, 1000);
        }

        function stopTimerInterval() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        function completeCurrentTimerRoutine() {
            const routine = timerQueue[currentTimerIndex];
            if (routine) {
                for (let sec of appData.sections) {
                    let r = sec.routines.find(item => item.id === routine.id);
                    if (r) {
                        r.completed = true;
                    }
                }
                saveData();
            }
            nextTimerRoutine();
        }

        function markCurrentRoutineCompleteAndAdvance() {
            const routine = timerQueue[currentTimerIndex];
            if (routine) {
                for (let sec of appData.sections) {
                    let r = sec.routines.find(item => item.id === routine.id);
                    if (r) {
                        r.completed = true;
                    }
                }
                saveData();
            }
            setTimeout(() => {
                loadTimerRoutine(currentTimerIndex + 1);
            }, 1000);
        }

        function nextTimerRoutine() {
            loadTimerRoutine(currentTimerIndex + 1);
        }

        function prevTimerRoutine() {
            if (currentTimerIndex > 0) {
                loadTimerRoutine(currentTimerIndex - 1);
            }
        }

        function openSettingsModal() {
            openModal('settings-modal');
        }

        function exportDataJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appData, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `routie_backup_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function importDataJSON(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const parsed = JSON.parse(e.target.result);
                    if (parsed && parsed.sections) {
                        appData = parsed;
                        saveData();
                        applyTheme(appData.currentTheme || 'theme-pink');
                        closeModal('settings-modal');
                        showNotification('복원 완료', '백업 파일이 성공적으로 복원되었습니다.');
                    } else {
                        showNotification('오류', '올바른 routie 백업 JSON 파일이 아닙니다.');
                    }
                } catch(err) {
                    showNotification('오류', 'JSON 파일을 파싱하는 중 문제가 발생했습니다.');
                }
            };
            reader.readAsText(file);
        }

        function resetAllData() {
            if (confirm('정말로 모든 데이터를 초기화하시겠습니까? 이 작업은 되돌릴 수 없습니다.')) {
                localStorage.removeItem('routie_habit_app_data_v30');
                location.reload();
            }
        }

        window.onload = init;
    </script>
</body>
</html>
